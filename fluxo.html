<!doctype html>
<html lang="pt-BR">
<head>
<script src="web_backend.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferramenta PDPAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: janela de aplicativo. Meia tela (640x672): trilho de fases + fluxo vertical com a ação dentro do passo.
   Tela larga (1240x760): BPMN horizontal com raias + resumo da fase à esquerda, painel do passo à direita.
   Codificação: setor = etiqueta e friso de 4 px; estado = preenchimento e ícone. Tema claro único, por escolha. */
:root{color-scheme:light}
*{box-sizing:border-box}
html{font-size:14px}
body{margin:0;background:#e9ebf0;color:#1d2430;font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-block:12px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.fora{max-width:640px;margin:0 auto 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:#5b6575}
.fora.wideN{max-width:1240px}
.fora button{font:inherit;padding:4px 10px;border:1px solid #cfd5de;border-radius:999px;background:#fff;color:#1d2430;cursor:pointer}
.fora button[aria-pressed="true"]{background:#1d2430;border-color:#1d2430;color:#fff;font-weight:600}
.fora select{font:inherit;padding:3px 6px;border:1px solid #cfd5de;border-radius:7px;background:#fff;color:#1d2430;margin-left:auto}
.app{--bg:#FFF7F1;--card:#fff;--txt:#4B3F5E;--muted:#67597A;--line:#E8DCF0;--accent:#8467D6;--sobre:#fff;--out:#3F9673;--feito-bg:#C6EEDC;
  --alerta-bg:#FFE9B5;--alerta-txt:#8A6510;--aviso-bg:#FFE3EA;--aviso-txt:#A12C52;--vez-bg:#DCCFF8;--bar:#4B3F5E;--bar-txt:#fff;--sel:#D9537A;
  --c0:#FFD9E1;--c1:#E6DCFA;--c2:#F6DFF7;--c3:#D5E6F8;--c4:#FFDCC6;--c5:#D3F0E3;
  --s0:#E8688A;--s1:#9478DE;--s2:#C76BD1;--s3:#5B9BD8;--s4:#E8935A;--s5:#4FA882;--f:"Nunito","Segoe UI",system-ui,sans-serif;--pes:700}
.app[data-tema="serio"]{--bg:#f6f7f9;--card:#fff;--txt:#1d2430;--muted:#5b6575;--line:#e2e6ec;--accent:#1f5fa8;--sobre:#fff;--out:#13915a;--feito-bg:#dff1e7;
  --alerta-bg:#fff0d9;--alerta-txt:#8a4b00;--aviso-bg:#fdecec;--aviso-txt:#8f1d1d;--vez-bg:#dbe8f8;--bar:#1f5fa8;--bar-txt:#fff;--sel:#1d2430;
  --c0:#d9e7f7;--c1:#e4e1f6;--c2:#eee3f1;--c3:#d6efe9;--c4:#fbe8cc;--c5:#deeeda;
  --s0:#1f5fa8;--s1:#5a55b5;--s2:#8e5aa8;--s3:#1f8f86;--s4:#c07a12;--s5:#3f8f4a;--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--pes:600}
.app{width:640px;max-width:100%;height:672px;margin:0 auto;background:var(--bg);color:var(--txt);font-family:var(--f);border-radius:12px;
  border:1px solid var(--line);box-shadow:0 6px 24px rgba(29,36,48,.16);overflow:hidden;display:flex;flex-direction:column}
.app.wide{width:1240px;height:760px}
button,select,input{font:inherit}
button{cursor:pointer;color:var(--txt)}
:is(button,a,select,input,[tabindex="0"]):focus-visible{outline:2px solid var(--sel);outline-offset:1px}
/* barra e contexto */
.bar{background:var(--bar);color:var(--bar-txt);display:flex;align-items:stretch;gap:10px;padding:0 8px 0 10px;flex:none}
.bar>b{align-self:center;font-size:1.02rem;font-weight:var(--pes)}.bar .sp{flex:1}
.bar>button{align-self:center;padding:2px 9px;background:transparent;color:var(--bar-txt);border:1px solid rgba(255,255,255,.45);border-radius:7px;font-size:.88rem}
.abas{display:flex;gap:2px;align-self:flex-end}
.abas button{border:0;background:none;color:var(--bar-txt);opacity:.82;padding:5px 9px 4px;margin-top:6px;border-radius:7px 7px 0 0;font-size:.88rem}
.abas button[aria-selected="true"]{background:var(--card);color:var(--txt);opacity:1;font-weight:var(--pes)}
.ctx{display:flex;align-items:center;gap:8px;padding:3px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:.86rem;flex:none}
.ctx .id{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{display:flex;gap:4px;flex:none}
.res>*{font-size:.78rem;border-radius:999px;padding:0 8px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.res .ok{background:var(--feito-bg);border-color:transparent;color:var(--txt)}
.res .w{background:var(--alerta-bg);border-color:var(--alerta-txt);color:var(--alerta-txt);font-weight:var(--pes)}
/* corpo */
.corpo{flex:1;min-height:0;padding:6px;display:flex;flex-direction:column;gap:5px}
.corpo.duo{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:5px;min-height:0;min-width:0}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0;display:flex;flex-direction:column;gap:5px}
.cresce{flex:1;min-height:0}.rol{overflow:auto}
.fh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none}
.fh h2{font-size:.95rem;font-weight:var(--pes);margin:0;flex:1}
.mini{padding:0 8px;font-size:.8rem;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.mini[aria-pressed="true"]{background:var(--bg);border-color:var(--accent);font-weight:var(--pes)}
p{margin:0}
.nota{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.aviso{background:var(--aviso-bg);color:var(--aviso-txt);border-radius:8px;padding:5px 9px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
abbr{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
h4{margin:2px 0 0;font-size:.78rem;font-weight:var(--pes);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* trilho das fases */
.trilho{display:flex;align-items:center;gap:3px;flex:none}
.trilho .ev{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--txt);background:var(--card);flex:none}
.trilho .ev.fim{border-width:3.5px}
.trilho i{flex:none;width:5px;height:1.4px;background:var(--txt)}
.trilho button{flex:none;min-width:30px;height:24px;padding:0 6px;border:1.4px solid var(--txt);border-radius:6px;background:var(--card);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilho .done{background:var(--feito-bg);border-color:var(--out)}
.trilho .wait{background:var(--alerta-bg);border-color:var(--alerta-txt)}
.trilho .cur{background:var(--vez-bg);border-color:var(--accent)}
.trilho .na{opacity:.45;border-style:dashed}
.trilho .ab{flex:1;min-width:0;text-align:left;font-weight:var(--pes);border-width:2.4px}
/* fluxo vertical (meia tela) */
.fluxo{display:flex;flex-direction:column}
.ps{display:grid;grid-template-columns:88px 24px minmax(0,1fr);gap:0 4px;align-items:start}
.setor,.tag{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ps .setor{justify-self:end;margin-top:6px}
.b0{background:var(--c0)}.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.b4{background:var(--c4)}.b5{background:var(--c5)}
.app[data-cor="mais"] .b0{background:var(--s0);color:#fff}.app[data-cor="mais"] .b1{background:var(--s1);color:#fff}.app[data-cor="mais"] .b2{background:var(--s2);color:#fff}
.app[data-cor="mais"] .b3{background:var(--s3);color:#fff}.app[data-cor="mais"] .b4{background:var(--s4);color:#fff}.app[data-cor="mais"] .b5{background:var(--s5);color:#fff}
.esp{position:relative;align-self:stretch;display:flex;justify-content:center}
.esp::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1.6px;margin-left:-.8px;background:var(--txt)}
.ps.ini .esp::before{top:8px}.ps.fim .esp::before{bottom:auto;height:6px}
.mc{position:relative;margin-top:5px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--txt);background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:var(--pes);line-height:1}
.mc.done{background:var(--feito-bg);border-color:var(--out)}.mc.wait{background:var(--alerta-bg);border-color:var(--alerta-txt);color:var(--alerta-txt)}
.mc.cur{background:var(--vez-bg);border-color:var(--accent);border-width:2.4px}
.mc.gw{border-radius:2px;transform:rotate(45deg);width:16px;height:16px;margin-top:8px}.mc.gw span{transform:rotate(-45deg);font-size:13px}
.mc.tm{box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--txt)}
.ps.ini .mc,.ps.fim .mc{width:12px;height:12px;margin-top:3px}.ps.fim .mc{border-width:4px}
.ps.ini,.ps.fim{color:var(--muted);font-size:11px;min-height:19px}.ps.ini>span:last-child,.ps.fim>span:last-child{padding-top:2px}
.tc{margin:2px 0;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:7px;background:var(--card);min-width:0;overflow:hidden}
.tc.done{background:var(--feito-bg)}.tc.wait{background:var(--alerta-bg)}.tc.cur{background:var(--vez-bg)}.tc.skip{opacity:.4}
.tc.sel{box-shadow:0 0 0 2px var(--sel)}
.cab{display:flex;align-items:center;gap:6px;width:100%;padding:4px 8px;border:0;background:none;text-align:left;font-weight:var(--pes);font-size:13px}
.cab>span:first-child{flex:1;min-width:0}
.cab .stt{font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap}
.cab small{font-weight:400}
.corp{background:var(--card);border-top:1px solid var(--line);padding:5px 8px 7px;display:flex;flex-direction:column;gap:5px}
.docic{flex:none;width:9px;height:12px;background:var(--accent);clip-path:polygon(0 0,62% 0,100% 28%,100% 100%,0 100%)}
/* checklist do passo */
.passos{list-style:none;margin:0;padding:0;counter-reset:p;display:flex;flex-direction:column}
.passos li{counter-increment:p;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid var(--line)}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);font-size:.74rem;font-weight:var(--pes);display:grid;place-items:center;color:var(--muted)}
.passos li.ok::before{content:"✓";background:var(--feito-bg);border-color:var(--out);color:var(--txt)}
.passos li.ok>span{color:var(--muted)}
.passos li>span{flex:1 1 220px;min-width:0}
.ramo{display:flex;gap:8px;align-items:center}
.passos button,.passos input,.ramo button,.botoes button{padding:2px 10px;border-radius:7px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:var(--pes);font-size:.88rem}
.passos input{width:150px;background:var(--card);color:var(--txt);border-color:var(--line);font-weight:400}
.pri{background:var(--accent)!important;color:var(--sobre)!important}
.lnk{border-color:transparent!important;text-decoration:underline;text-underline-offset:3px}
.botoes,.tg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
dl{margin:0;display:grid;grid-template-columns:minmax(92px,auto) 1fr;gap:2px 10px}
dt{color:var(--muted);font-size:.82rem}dd{margin:0}
.falta{background:var(--alerta-bg);color:var(--alerta-txt);border-radius:6px;padding:0 7px;font-size:.78rem}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:8px;border-bottom:1px solid var(--line);padding:2px 0}
.hist time{color:var(--muted);font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
/* painel (tela larga) */
.pt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pt h3{margin:0;font-size:1.05rem;font-weight:var(--pes);line-height:1.2;text-wrap:balance}
.st{font-size:11px;border-radius:999px;padding:0 8px;border:1px solid var(--line);white-space:nowrap}
.st.done{background:var(--feito-bg);border-color:transparent}.st.wait{background:var(--alerta-bg);border-color:transparent;color:var(--alerta-txt)}
.st.cur{background:var(--accent);border-color:var(--accent);color:var(--sobre);font-weight:var(--pes)}
.sc{display:grid;place-items:center;min-height:0}.sc svg{display:block}
/* mapa do processo */
.mapa{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow:auto}
.mfa{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;padding:2px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.mfa.at{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.mfa.na{opacity:.5}
.nm{border:0;background:none;text-align:left;font-weight:var(--pes);font-size:12.5px;padding:0}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.seq{display:flex;flex-wrap:wrap;gap:3px 2px;align-items:center}
.no{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:1px 6px;background:var(--card)}
.no.done{background:var(--feito-bg)}.no.wait{background:var(--alerta-bg)}.no.cur{background:var(--vez-bg);font-weight:var(--pes)}.no.skip{opacity:.4}
.no.sel{box-shadow:0 0 0 2px var(--sel)}
.seta{color:var(--muted);font-size:11px}
/* tabelas */
table{border-collapse:collapse;font-size:.88rem;width:100%}
td,th{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:var(--pes)}
td small{display:block;color:var(--muted)}
td.arq{overflow-wrap:anywhere}
td.nao{color:var(--muted)}
tr.dif td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.dif td{background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.selo{font-size:10px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 6px;margin-left:4px;white-space:nowrap}
tr.clicavel{cursor:pointer}tr.clicavel:hover td{background:var(--bg)}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px}
.leg div{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}.leg b{display:block}
#tip{position:fixed;z-index:50;max-width:300px;background:#1d2430;color:#fff;border-radius:7px;padding:6px 9px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
/* desenho BPMN (tela larga) */
svg text{font-family:var(--f);fill:var(--txt)}
.mkf{fill:var(--txt)}.mko{fill:var(--card);stroke:var(--txt)}
.pool,.poolx{fill:var(--bg);stroke:var(--muted)}
.ln{fill:var(--card);stroke:var(--muted);stroke-width:.8}.lb{stroke:var(--muted);stroke-width:.8}
.c0{fill:var(--c0)}.c1{fill:var(--c1)}.c2{fill:var(--c2)}.c3{fill:var(--c3)}.c4{fill:var(--c4)}.c5{fill:var(--c5)}
.s0{fill:var(--s0)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}.s5{fill:var(--s5)}
.app[data-cor="mais"] .ln.k0{fill:color-mix(in srgb,var(--c0) 40%,var(--card))}.app[data-cor="mais"] .ln.k1{fill:color-mix(in srgb,var(--c1) 40%,var(--card))}
.app[data-cor="mais"] .ln.k2{fill:color-mix(in srgb,var(--c2) 40%,var(--card))}.app[data-cor="mais"] .ln.k3{fill:color-mix(in srgb,var(--c3) 40%,var(--card))}
.app[data-cor="mais"] .ln.k4{fill:color-mix(in srgb,var(--c4) 40%,var(--card))}.app[data-cor="mais"] .ln.k5{fill:color-mix(in srgb,var(--c5) 40%,var(--card))}
.app[data-cor="mais"] .cartao.pn{border-top:4px solid var(--accent)}
.lbt{font-weight:var(--pes)}
.ed{fill:none;stroke:var(--txt);stroke-width:1.2}.mf{fill:none;stroke:var(--txt);stroke-width:1.1;stroke-dasharray:5 3}
.edl{font-size:10px;font-weight:var(--pes);fill:var(--sel)}
.nd{cursor:pointer}.sh,.shx{fill:var(--card);stroke:var(--txt);stroke-width:1.2}
.nd.done .sh{fill:var(--feito-bg);stroke:var(--out)}.nd.wait .sh{fill:var(--alerta-bg);stroke:var(--alerta-txt)}
.nd.cur .sh{fill:var(--vez-bg);stroke:var(--accent);stroke-width:2.6}
.nd.skip{opacity:.32}.nd.sel .sh{stroke:var(--sel);stroke-width:3}
.nd text{font-weight:var(--pes)}.mk{fill:none;stroke:var(--txt);stroke-width:1.6}.mk1{fill:none;stroke:var(--txt);stroke-width:1}
.ev{fill:var(--card);stroke:var(--txt);stroke-width:1.4}.ev.end{stroke-width:3.6}
.dob{fill:var(--card);stroke:var(--muted);stroke-width:1}.dob.on{fill:var(--accent);stroke:var(--accent)}
.ck{fill:var(--out)}.wt{fill:var(--alerta-txt)}.bw{fill:none;stroke:#fff;stroke-width:1.6}
@media (max-width:520px){
  .app,.app.wide{height:auto;min-height:480px}.rol,.mapa{overflow:visible}
  .bar{flex-wrap:wrap;padding-top:4px}.abas{order:3;width:100%;flex-wrap:wrap}
  .ctx{flex-wrap:wrap}.ps{grid-template-columns:70px 22px minmax(0,1fr)}
  .mfa{grid-template-columns:1fr}dl{grid-template-columns:1fr}
}
/* v12: meia tela como a alternativa C, tela larga como a alternativa B */
.trilho{gap:4px}
.trilho button{height:28px;min-width:30px;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.trilho .done{background:var(--feito-bg);border-color:var(--out)}.trilho .wait{background:var(--alerta-bg);border-color:var(--alerta-txt)}.trilho .cur{background:var(--vez-bg);border-color:var(--accent)}
.trilho .ab{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px 0 10px;background:var(--accent);border:1px solid var(--accent);color:var(--sobre);font-weight:var(--pes)}
.trilho .ab>span:first-child{overflow:hidden;text-overflow:ellipsis}
.ct{background:rgba(255,255,255,.26);border-radius:999px;padding:0 8px;font-size:11px;font-weight:400}
.ps{align-items:center;grid-template-columns:62px 24px minmax(0,1fr)}
.ps .setor{margin-top:0;align-self:start;margin-top:9px}
.mc{margin-top:8px;align-self:start}.mc.gw{margin-top:11px}
.esp{align-items:flex-start}
.fluxo>.ps:first-child .esp::before{top:10px}.fluxo>.ps:last-child .esp::before{bottom:auto;height:10px}
.tc{margin:3px 0;border-radius:8px}
.tc.sel{box-shadow:none;border:2px solid var(--accent);border-left-width:5px}
.tc.gwc:not(.sel){border-style:dashed;border-left-style:solid;background:var(--bg)}
.cab{padding:6px 9px;gap:8px}
.dc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.docic{opacity:.45}.docic.on{opacity:1}
.rm{font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--card);white-space:nowrap}
.cab .st{font-weight:400}
.corp{padding:6px 10px 9px;gap:6px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acoes button:not(.mini),.acoes input{padding:4px 12px;border-radius:7px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:var(--pes);font-size:.9rem}
.acoes input{flex:1 1 120px;min-width:100px;max-width:220px;background:var(--card);color:var(--txt);border-color:var(--line);font-weight:400}
.acoes .mini{padding:3px 10px;font-size:.86rem}
.caixa{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;gap:3px}
.app.wide{height:auto;max-height:none}
.corpo.duo{grid-template-rows:auto;align-items:start}
.pn{gap:7px}
.mfa{grid-template-columns:150px minmax(0,1fr) auto}
.mapa{gap:4px}.cartao>.mapa{overflow:visible}
@media (max-width:520px){.mfa{grid-template-columns:1fr auto}.mfa .seq{grid-column:1/-1}.ps{grid-template-columns:56px 22px minmax(0,1fr)}}

function montarDocs(){S.docs={};S.arqs={};

    a+=`<button class="${s}${ab_?" ab":""}" data-f="${f}" aria-pressed="${ab_}" data-tip="${esc((f+1)+". "+F[f][0]+". "+(na?"Não existe neste tipo de compra.":dn+" de "+q.length+" passos feitos."))}">${tx}</button>`}

const WD={task:96,gw:30,start:16,end:18,timer:24},TH=38,LH=70,GAP=18,PW=15,LW=72;
function diagram(ns){

  const lanes=[...new Set(ns.map(n=>n.l))].sort(),pools=[...new Set(ns.filter(n=>n.msg).map(n=>n.msg[0]))],P=new Map();let x=PW+LW+12,W=0;
  for(const n of seq){const w=WD[n.kind];P.set(n.id,{x,w,r:x+w,cx:x+w/2,cy:lanes.indexOf(n.l)*LH+LH/2});W=x+w+10;x+=w+(n.kind==="gw"?36:GAP)}
  const HL=lanes.length*LH,py=k=>HL+7+pools.indexOf(k)*26,H=HL+(pools.length?7+pools.length*26:0),g=GAP/2,r=15;let a="";

  lanes.forEach((l,i)=>{const y=i*LH;a+=`<rect class="ln k${l}" x="${PW}" y="${y}" width="${W-PW}" height="${LH}"/><g data-tip="${tipSetor(l)}" tabindex="0"><rect class="lb c${l}" x="${PW}" y="${y}" width="${LW}" height="${LH}"/><rect class="s${l}" x="${PW}" y="${y}" width="4" height="${LH}"/>${tx(laneTxt(l),PW+LW/2+2,y+LH/2,10.5,"lbt")}</g>`});
  pools.forEach(k=>{a+=`<g tabindex="0" data-tip="${esc(k==="central"?"Áreas técnicas e de controle da Secretaria, fora da região."+sg("SES SUAG SINFRA GEMED"):"A empresa que vende o item ou presta o serviço.")}"><rect class="poolx" x="0" y="${py(k)}" width="${W}" height="20"/><text class="lbt" font-size="10" x="8" y="${py(k)+14}">${PX[k]}</text></g>`});
  const E=d=>`<path class="ed" d="${d}" marker-end="url(#a1)"/>`;
  for(let i=0;i<seq.length-1;i++){const A=seq[i],B=seq[i+1],pa=P.get(A.id),pb=P.get(B.id);
    if(A.kind==="gw"){const pc=P.get(seq[i+2].id);
      if(pb.cy===pa.cy){const yb=pa.cy+TH/2+12;a+=E(`M${pa.r},${pa.cy} H${pb.x}`)+E(`M${pa.cx},${pa.cy+r} V${yb} H${pc.x-g} V${pc.cy} H${pc.x}`)+`<text class="edl" x="${pa.r+5}" y="${pa.cy-4}">Sim</text><text class="edl" x="${pa.cx+5}" y="${pa.cy+r+9}">Não</text>`}
      else{const up=pb.cy<pa.cy;a+=E(`M${pa.cx},${pa.cy+(up?-r:r)} V${pb.cy} H${pb.x}`)+E(`M${pa.r},${pa.cy} H${pc.x-g} V${pc.cy} H${pc.x}`)+`<text class="edl" x="${pa.cx+5}" y="${pa.cy+(up?-r-3:r+10)}">Sim</text><text class="edl" x="${pa.r+5}" y="${pa.cy-4}">Não</text>`}}
    else a+=E(`M${pa.r},${pa.cy} H${pa.r+g} V${pb.cy} H${pb.x}`)}
  for(let i=0;i<seq.length;i++){const n=seq[i],p=P.get(n.id);
    if(n.kind==="start"){a+=`<circle class="ev" cx="${p.cx}" cy="${p.cy}" r="7" data-tip="Início desta fase."/>`;continue}
    if(n.kind==="end"){a+=`<circle class="ev end" cx="${p.cx}" cy="${p.cy}" r="7" data-tip="Fim desta fase."/>`;continue}
    const s=stat(n),sel=S.sel.k==="n"&&S.sel.id===n.id,tip=esc(lab(n)+". "+STN[s]+". Quem faz: "+laneNome(n.l)+"."+sg(lab(n)+" "+SH[n.id]+" "+laneOrg(n.l)));
    a+=`<g class="nd ${s}${sel?" sel":""}" data-n="${n.id}" data-tip="${tip}" tabindex="0" role="button" aria-label="${tip}">`;
    if(n.kind==="gw"){const sobe=P.get(seq[i+1].id).cy<p.cy;a+=`<polygon class="sh" points="${p.cx},${p.cy-r} ${p.cx+r},${p.cy} ${p.cx},${p.cy+r} ${p.cx-r},${p.cy}"/><path class="mk" d="M${p.cx-4},${p.cy-4}l8,8M${p.cx+4},${p.cy-4}l-8,8"/>`+tx([SH[n.id]],p.cx,sobe?p.cy+r+10:p.cy-r-7,10)}
    else if(n.kind==="timer")a+=`<circle class="sh" cx="${p.cx}" cy="${p.cy}" r="12"/><circle cx="${p.cx}" cy="${p.cy}" r="9.5" class="mk1"/><path class="mk" stroke-width="1.2" d="M${p.cx},${p.cy-6}V${p.cy}h4"/>`+tx([SH[n.id]],p.cx,p.cy+22,10);
    else{const y=p.cy-TH/2;a+=`<rect class="sh" x="${p.x}" y="${y}" width="${p.w}" height="${TH}" rx="7"/><rect class="s${n.l}" x="${p.x+1.5}" y="${y+4}" width="4" height="${TH-8}" rx="2"/>`+tx(wrap(SH[n.id],13),p.cx+3,p.cy,10.5);
      if(n.doc)a+=`<path class="dob ${S.docs[n.id]?"on":""}" d="M${p.r-13},${y+TH-4}h6l3,3v9h-9z"/>`;
      if(n.msg){const yp=py(n.msg[0]),yt=y+TH,d=n.msg[1];
        if(d!=="in")a+=`<path class="mf" d="M${p.cx-(d==="both"?6:0)},${yt} V${yp}" marker-start="url(#a3)" marker-end="url(#a2)"/>`;
        if(d!=="out")a+=`<path class="mf" d="M${p.cx+(d==="both"?6:0)},${yp} V${yt}" marker-start="url(#a3)" marker-end="url(#a2)"/>`}}
    const bx=n.kind==="task"?p.r-2:p.cx+11,byy=n.kind==="task"?p.cy-TH/2+2:p.cy-11;
    if(s==="done")a+=`<circle class="ck" cx="${bx}" cy="${byy}" r="6"/><path class="bw" d="M${bx-3},${byy}l2.2,2.4l3.8,-4.6"/>`;
    if(s==="wait")a+=`<circle class="wt" cx="${bx}" cy="${byy}" r="6"/><path class="bw" d="M${bx},${byy-3.5}V${byy}h2.8"/>`;
    a+="</g>"}
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.round(W*1.3)}px;height:auto" role="group" aria-label="Fluxograma da fase">${a}</svg>`}
function painel(n){const s=stat(n),P=partes(n),o=ORG[laneOrg(n.l)];
  return `<div class="pt"><h3>${ab(n.q||SH[n.id])}</h3><span style="flex:1"></span><span class="st ${s}">${STN[s]}</span></div>${P.l}${P.a?`<div class="acoes">${P.a}</div>`:""}${P.x}`
    +`<div class="caixa"><h4>Quem faz</h4><p><span class="tag b${n.l}">${laneOrg(n.l)}</span> ${o[0]}. ${ab(o[2])}</p><h4>Base</h4><p>${ab(n.bn)}</p></div><div class="acoes">${tg("Detalhes completos","Histórico")}</div>${extra(n)}`}
function pedidoLargo(){const f=S.fase,q=path().filter(n=>n.f===f),X=F[f];
  if(q.length&&!(S.sel.k==="n"&&q.some(n=>n.id===S.sel.id))){const c=cur();S.sel={k:"n",id:(c&&c.f===f?c:q[0]).id}}
  return `<div class="cartao">${trilho()}${q.length?`<div class="sc">${diagram(q)}</div>`:`<div class="aviso">Esta fase não existe em ${TIPO[S.tipo].toLowerCase()}.</div>`}<div class="caixa"><p><b>Resumo da Fase ${f+1}:</b> ${ab(X[1])} ${ab(X[4])}</p><p class="nota"><b>Entra</b> ${ab(X[2])} → <b>Sai</b> ${ab(X[3])}</p></div></div>`
    +`<div class="cartao pn">${q.length?painel(by(S.sel.id)):`<p class="nota">Nenhum passo nesta fase.</p>`}</div>`}

/* ---------- aba Processo: mapa vertical ---------- */
function mapa(){const p=path(),lg=larga();if(lg&&!(S.prev&&p.some(n=>n.id===S.prev))){const c=cur();S.prev=(c||p[0]).id}
  const rows=F.map((X,f)=>{const q=p.filter(n=>n.f===f),st_=fst(f);
    return `<div class="mfa${S.fase===f?" at":""}${q.length?"":" na"}"><button class="nm" data-ir="${f}" data-tip="Abrir esta fase na aba Pedido.">${f+1}. ${X[0]}</button><div class="seq">`
      +q.map(n=>{const s=stat(n);return `<button class="no ${s}${lg&&S.prev===n.id?" sel":""}" style="border-left-color:var(--s${n.l})" ${lg?"data-pv":"data-n"}="${n.id}" data-tip="${esc(lab(n)+". "+STN[s]+". "+laneNome(n.l)+"."+sg(lab(n)+" "+SH[n.id]+" "+laneOrg(n.l)))}">${s==="done"?"✓":s==="wait"?REL:n.kind==="gw"?"◇":""}${esc(SH[n.id])}</button>`}).join("")
      +`</div><span class="st ${st_.s==="na"?"":st_.s}">${q.length?st_.dn+"/"+st_.q.length:"não se aplica"}</span></div>`}).join("");
  const esq=`<div class="mapa">${rows}</div>`;if(!lg)return esq;
  const n=by(S.prev),s=stat(n),u=S.h.filter(x=>x[2]===n.id).pop();
  return `<div class="cartao">${esq}</div><div class="cartao pn"><h4>Passo selecionado</h4><div class="pt"><h3>${ab(n.q||lab(n))}</h3></div><div class="pt"><span class="st ${s}">${STN[s]}</span><span class="tag b${n.l}" tabindex="0" data-tip="${tipSetor(n.l)}">${laneNome(n.l)}</span><span class="nota">Fase ${n.f+1}: ${F[n.f][0]}</span></div><p>${u?`<span class="nota num">${u[0]}</span> ${ab(u[1])}`:ab(v(n.e,S.tipo))}</p><span style="flex:1"></span><div class="acoes"><button class="pri" data-n="${n.id}" style="flex:1">Abrir este passo →</button></div></div>`}

/* ---------- Comparar, Documentos, Histórico, legenda ---------- */
function comparar(){const f=S.fase;let r="";
  N.filter(n=>n.f===f).forEach(n=>{const dif=n.tp.length<3||typeof n.t==="object";
    r+=`<tr class="${dif?"dif":""}"><td>${ab(laneNome(n.l).replace("NUAL","NPDOC ou NUAL"))}${dif?`<span class="selo">difere</span>`:""}</td>`+["p","c","s"].map(t=>n.tp.includes(t)?`<td>${ab(n.kind==="gw"?"◇ "+lab(n,t):lab(n,t))}${n.cond?" (se sim)":""}</td>`:`<td class="nao">não tem</td>`).join("")+`</tr>`});
  return trilho()+`<div class="cartao cresce rol"><div class="fh"><h2>Fase ${f+1}: ${F[f][0]}, nos três tipos de compra</h2><span class="nota">Troque de fase no trilho acima.</span></div><table><tr><th>Quem faz</th><th>Permanente</th><th>Consumo</th><th>Serviço</th></tr>${r}</table></div>`}
function docsView(){const q=path().filter(n=>n.k==="peca"&&!skip(n));
  return `<div class="cartao cresce rol"><div class="fh"><h2>Minutas do pedido</h2><span class="nota">${q.filter(n=>S.docs[n.id]).length} de ${q.length} geradas</span></div><table><tr><th>Documento e fase</th><th>Arquivo e data</th><th>Nº ${ab("SEI")}</th></tr>`
    +q.map(n=>{const d=S.docs[n.id];return `<tr class="clicavel" data-n="${n.id}" tabindex="0" data-tip="Ir para este passo"><td>${ab(n.doc)}<small>${n.f+1}. ${F[n.f][0]}</small></td><td class="arq">${d?`${arq(n)}<small class="num">${d}</small><button type="button" class="mini" data-dl="${esc(arq(n))}">Baixar uma nova cópia</button>`:`<span class="nota">ainda não gerada</span>`}</td><td class="num">${S.sei[n.id]?esc(S.sei[n.id]):"–"}</td></tr>`}).join("")
    +`<tr><td>Checklist do processo, para anexar<small>todas as fases</small></td><td class="arq">${S.docs._ck?`${esc(S.arqs._ck||"")}<small class="num">${S.docs._ck}</small><button type="button" class="mini" data-dl="${esc(S.arqs._ck||"")}">Baixar uma nova cópia</button>`:`<span class="nota">ainda não gerado</span>`}</td><td class="num">–</td></tr></table>`
    +`<p class="nota">Cada minuta sai no passo em que é usada. O checklist pode ser gerado a qualquer momento.</p><div class="botoes"><button class="pri" data-a="ck">${S.docs._ck?"Gerar o checklist de novo":"Gerar o checklist"}</button>${S.docs._ck?`<button data-a="abrirck">Baixar o checklist (Word)</button>`:""}<button data-a="pasta">Baixar todas as minutas (.zip)</button><button type="button" data-del="${esc(PED.id)}">Apagar este pedido</button></div>${S.msg?`<p class="nota" role="status">${S.msg}</p>`:""}</div>`}
function legenda(){const L=[
   [`<circle class="ev" cx="27" cy="17" r="9"/>`,"Início","Círculo de linha fina. É onde o processo, ou a fase, começa."],
   [`<circle class="ev end" cx="27" cy="17" r="9"/>`,"Fim","Círculo de linha grossa. É onde termina."],
   [`<rect class="shx" x="6" y="5" width="42" height="24" rx="7"/><rect class="s1" x="8" y="9" width="4" height="16" rx="2"/>`,"Tarefa","Um trabalho que alguém faz. O friso colorido à esquerda mostra o setor responsável."],
   [`<rect class="shx" x="6" y="3" width="42" height="28" rx="6"/><rect x="22" y="20" width="10" height="10" class="shx"/><path d="M24.5,25h5M27,22.5v5" class="mk1"/>`,"Fase (subprocesso)","Um conjunto de tarefas. No trilho do alto, cada número é uma fase; clique para abrir."],
   [`<polygon class="shx" points="27,3 41,17 27,31 13,17"/><path class="mk" d="M22,12l10,10M32,12l-10,10"/>`,"Decisão","Uma pergunta. Só um dos caminhos segue, conforme a resposta."],
   [`<circle class="shx" cx="27" cy="17" r="13"/><circle cx="27" cy="17" r="10" class="mk1"/><path class="mk" stroke-width="1.3" d="M27,10v7h5"/>`,"Espera com prazo","O processo fica parado até o prazo acabar."],
   [`<rect class="ln" x="2" y="4" width="50" height="26"/><rect class="lb c1" x="2" y="4" width="14" height="26"/><path d="M16,17h36" class="mk1"/>`,"Raias","Cada faixa é um setor. A tarefa fica na faixa de quem a faz."],
   [`<path class="ed" d="M6,17H46" marker-end="url(#a1)"/>`,"Seta cheia","A ordem das tarefas dentro da região."],
   [`<path class="mf" d="M6,17H46" marker-start="url(#a3)" marker-end="url(#a2)"/>`,"Seta tracejada","Mensagem trocada com quem está fora da região: a empresa ou a Administração Central."],
   [`<path class="dob" d="M19,4h10l6,6v20h-16z"/>`,"Documento","O papel que a tarefa produz e que entra no processo SEI. Preenchido quando a minuta já foi gerada."],
   [`<g class="nd done"><rect class="sh" x="6" y="5" width="42" height="24" rx="7"/></g><circle class="ck" cx="46" cy="7" r="6"/><path class="bw" d="M43,7l2.2,2.4l3.8,-4.6"/>`,"Verde com visto","Passo já feito."],
   [`<g class="nd wait"><rect class="sh" x="6" y="5" width="42" height="24" rx="7"/></g><circle class="wt" cx="46" cy="7" r="6"/><path class="bw" d="M46,3.5V7h2.8"/>`,"Âmbar com relógio","Você já pediu e está aguardando outro setor."],
   [`<g class="nd cur"><rect class="sh" x="6" y="5" width="42" height="24" rx="7"/></g>`,"Destaque com borda grossa","É a vez deste passo."]];
  return `<div class="cartao cresce rol"><div class="fh"><h2>Como ler o desenho</h2><button class="mini" data-a="leg">Fechar</button></div><p>O fluxograma segue a notação <abbr tabindex="0" data-tip="${esc(tipOrg("BPMN"))}">BPMN</abbr>, a norma internacional para desenhar processos. Na meia tela o fluxo corre de cima para baixo; na tela larga, da esquerda para a direita, com raias.</p><div class="leg">${L.map(x=>`<div><svg width="54" height="34" viewBox="0 0 54 34">${x[0]}</svg><span><b>${x[1]}</b>${ab(x[2])}</span></div>`).join("")}</div></div>`}

/* ---------- explicação detalhada do processo ---------- */
function explicacao(){const p=path(),dx=(t,x)=>x?`<dt>${t}</dt><dd>${ab(x)}</dd>`:"";
  const tipos=PED?`<span class="nota">${TIPO[S.tipo]}</span>`:Object.keys(TIPO).map(k=>`<button class="mini" data-tp="${k}" aria-pressed="${S.tipo===k}">${TIPO[k]}</button>`).join("");
  return trilho()+`<div class="cartao cresce rol"><div class="fh"><h2>Explicação do processo</h2>${tipos}<a class="bt" href="index.html">Voltar ao pedido</a></div>`
    +F.map((X,f)=>{const q=p.filter(n=>n.f===f);let i=0;
      return `<section class="expf" id="expf${f}"><h3>Fase ${f+1}: ${X[0]}</h3>`+(q.length?faseTxt(f)+`<div class="sc">${diagram(q)}</div>`+q.map(n=>{if(n.kind==="task")i++;const gw=n.kind==="gw";
        return `<div class="expp" id="xp-${n.id}" style="border-left-color:var(--s${n.l})"><p><b>${gw?"Decisão: ":n.kind==="task"?i+". ":""}${ab(gw?n.q:lab(n))}</b> <span class="tag b${n.l}">${laneCurto(n.l)}</span></p>`
          +(gw?`<p>Sim: ${ab(n.sim)}</p><p>Não: ${ab(n.nao)}</p>`:`<p>${ab(v(n.e,S.tipo))}</p>`)
          +`<dl>${dx("O que pedir",v(n.pd,S.tipo))}${dx("O que volta",n.vt)}${dx("Prazo",n.pz)}${dx("Como obter ou cobrar",n.ob)}${dx("Ao voltar",n.dv)}${dx("Documento",n.doc)}${dx("Base",n.bn)}</dl></div>`}).join("")
        :`<p class="nota">Esta fase não existe em ${TIPO[S.tipo].toLowerCase()}.</p>`)+`</section>`}).join("")+`</div>`}

/* ---------- lista de pedidos ---------- */
function andamento(p){const t=TP[p.tipo],f=p.fluxo||{},d=f.d||{},a=f.ans||{},q=N.filter(n=>n.tp.includes(t)&&!(n.cond&&a[n.cond]==="n")),c=q.find(n=>d[n.id]!=="d");
  return `${q.filter(n=>d[n.id]==="d").length}/${q.length} · `+(c?`Fase ${c.f+1}: ${F[c.f][0]}`+(d[c.id]==="w"?" (aguardando)":""):"concluído")}
function pedidosView(){
  return `<div class="cartao cresce rol"><div class="fh"><h2>Pedidos</h2><a class="bt" href="index.html" data-tip="Abre as telas de preenchimento: item, quantidade, condições e texto. Ao gerar as minutas, o pedido entra nesta lista.">Novo pedido</a></div>`
    +(LISTA.length?`<table><tr><th>Pedido</th><th>Tipo</th><th>Andamento</th><th>Criado em</th><th></th></tr>${LISTA.map(p=>`<tr class="clicavel" data-p="${esc(p.id)}" tabindex="0" data-tip="Abrir este pedido no fluxo"><td>${esc(p.codigo||"Serviço")}<small>${esc(p.item)}</small></td><td>${TIPO[TP[p.tipo]]||"–"}</td><td>${TP[p.tipo]?andamento(p):"–"}</td><td class="num">${esc(p.criado)}</td><td><button type="button" class="mini" data-del="${esc(p.id)}">Apagar</button></td></tr>`).join("")}</table>`
      :`<p>Nenhum pedido gerado ainda. Comece por “Novo pedido”: você preenche o item, a quantidade e os textos, e a ferramenta gera as minutas. Depois o pedido aparece aqui, para acompanhar passo a passo.</p>`)
    +`<p class="nota">Pedidos que você começou a preencher e ainda não gerou ficam guardados no formulário, em “Rascunhos”.</p>${S.msg?`<p class="aviso" role="status">${esc(S.msg)}</p>`:""}</div>`}
async function carregarLista(){try{LISTA=(await api("/api/pedidos")).pedidos}catch(e){S.msg=e.message}}
async function abrirPedido(id){try{PED=await api("/api/pedido?id="+encodeURIComponent(id))}catch(e){S.msg=e.message;S.view="pedidos";render();return}
  if(!TP[PED.tipo]){S.msg="Este pedido não tem tipo definido; não dá para montar o fluxo.";PED=null;S.view="pedidos";render();return}
  const f=PED.fluxo||{};S.tipo=TP[PED.tipo];S.d=f.d||{};S.sei=f.sei||{};S.h=f.h||[];
  S.ans=f.ans||{g:PED.ata==="vigente"?"s":PED.ata==="sem"?"n":undefined,gs1:PED.reparo?"s":"n",gs2:PED.predio?"s":"n"};
  if(S.ans.g===undefined)delete S.ans.g;
  if(!S.h.length)log("Pedido aberto no fluxo. Minutas encontradas na pasta: "+PED.arquivos.length+".","_ck");
  montarDocs();S.msg="";S.view="pedido";S.leg=false;S.prev="";ultimoSalvo="";const c=cur();selFase(c?c.f:(typeof f.fase==="number"?f.fase:0));render()}

/* ---------- montagem e eventos ---------- */
const $=id=>document.getElementById(id);
function render(){const C=$("corpo"),A=$("app"),lg=larga();if(!PED&&S.view!=="exp")S.view="pedidos";
  A.classList.toggle("wide",lg);A.dataset.tema=S.tema;A.dataset.cor=S.cor;
  $("bWide").textContent=S.wide?"Reduzir":"Ampliar";$("estilo").value=S.tema+"-"+S.cor;
  document.querySelectorAll("#vtabs button").forEach(b=>{b.setAttribute("aria-selected",!S.leg&&b.dataset.v===S.view);b.disabled=!PED&&b.dataset.v!=="pedidos"&&b.dataset.v!=="exp"});
  const noPedido=PED&&S.view!=="pedidos";let h,duo=false;
  if(S.leg)h=legenda();
  else if(S.view==="exp")h=explicacao();
  else if(S.view==="pedidos")h=pedidosView();
  else if(S.view==="comparar")h=comparar();
  else if(S.view==="docs")h=docsView();
  else if(S.view==="hist")h=`<div class="cartao cresce rol"><div class="fh"><h2>Histórico do pedido</h2></div>${hist()}</div>`;
  else if(S.view==="inteiro"){h=mapa();duo=lg}
  else if(lg){h=pedidoLargo();duo=true}
  else h=pedidoEstreito();
  $("ctxid").textContent=QUEDA?"A ferramenta foi encerrada: feche esta janela e abra de novo pelo atalho.":noPedido?(PED.codigo||"Serviço")+" · "+PED.item+" · "+TIPO[S.tipo]:S.view==="exp"?"Explicação do processo":"Pedidos em andamento";
  $("res").innerHTML=noPedido?resumo():"";
  C.className="corpo"+(duo?" duo":"");C.innerHTML=h;if(S.view==="exp"&&!S.leg){const x=$("expf"+S.fase);if(x&&S.fase)x.scrollIntoView()}save()}
async function gerar(chave,rotulo,id){try{const r=await api("/api/gerar_peca",{id:PED.id,peca:chave});PED.arquivos=r.arquivos;montarDocs();log("Minuta gerada: "+r.arquivo+".",id);S.msg="Gerada: "+r.arquivo}catch(e){S.msg="Não gerei "+rotulo+": "+e.message}render()}
function abrirArq(nome){api("/api/abrir",{alvo:nome?PED.pasta+"\\"+nome:PED.pasta}).catch(e=>{S.msg=e.message;render()})}
function act(a){S.msg="";const n=S.sel.k==="n"?by(S.sel.id):null,sei=(($("sei")||{}).value||"").trim();
  if(a==="leg")S.leg=!S.leg;
  else if(a==="fase")S.sel=S.sel.k==="f"?{k:"x"}:{k:"f"};
  else if(a==="bpmn")S.bp=!S.bp;
  else if(a==="ck")return gerar("checklist","o checklist","_ck");
  else if(a==="abrirck")return abrirArq(S.arqs._ck);
  else if(a==="pasta")return abrirArq("");
  else if(!n)return;
  else if(a==="minuta")return gerar(PK[n.id],"a minuta",n.id);
  else if(a==="abrir")return abrirArq(arq(n));
  else if(a==="pedi"){S.d[n.id]="w";log("Pedido registrado. Aguardando "+laneNome(n.l)+".",n.id)}
  else if(a==="reabrir"){delete S.d[n.id];log("Passo reaberto.",n.id)}
  else if(a==="feito"||a==="sim"||a==="nao"){S.d[n.id]="d";
    if(a==="feito"){if(sei)S.sei[n.id]=sei;log((n.kind==="timer"?"Prazo encerrado.":n.k==="peca"?"Marcado como feito.":"Devolutiva registrada.")+(sei?" SEI "+sei+".":""),n.id)}
    else{S.ans[n.id]=a==="sim"?"s":"n";log("Decisão “"+n.t+"”: "+(a==="sim"?"sim":"não")+".",n.id)}
    const c=cur();if(c){S.fase=c.f;S.sel={k:"n",id:c.id};S.sub=""}}
  render()}
function janela(ampla){try{const sw=screen.availWidth,sh=screen.availHeight,x0=screen.availLeft||0,y0=screen.availTop||0,w=ampla?Math.min(sw,1300):Math.floor(sw/2);
  window.resizeTo(w,sh);window.moveTo(x0+sw-w,y0)}catch(e){}}
const tip=$("tip");
function showTip(el){tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8)),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;tip.style.left=x+"px";tip.style.top=Math.max(8,y)+"px"}
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el);else tip.hidden=true});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.target.matches(":focus-visible"))showTip(el)});
["focusout","scroll"].forEach(ev=>document.addEventListener(ev,()=>{tip.hidden=true},true));
document.addEventListener("click",async e=>{tip.hidden=true;const t=e.target;let el;
  if(el=t.closest("[data-p]"))abrirPedido(el.dataset.p);
  else if(el=t.closest("[data-tp]")){if(!PED){S.tipo=el.dataset.tp;render()}}
  else if(el=t.closest("[data-pv]")){S.prev=el.dataset.pv;render()}
  else if(el=t.closest("[data-n]")){const id=el.dataset.n;if(S.view==="exp"&&!S.leg){const x=$("xp-"+id);if(x)x.scrollIntoView({block:"center"});return}const era=S.view==="pedido"&&!S.leg&&!larga()&&S.sel.k==="n"&&S.sel.id===id&&el.classList.contains("cab");
    S.msg="";S.view="pedido";S.leg=false;S.fase=by(id).f;S.sub="";S.sel=era?{k:"x"}:{k:"n",id};render()}
  else if(el=t.closest("[data-ir]")){S.view="pedido";selFase(+el.dataset.ir);render()}
  else if(el=t.closest("[data-f]")){selFase(+el.dataset.f);render()}
  else if(el=t.closest("[data-sb]")){S.sub=S.sub===el.dataset.sb?"":el.dataset.sb;render()}
  else if(el=t.closest("[data-v]")){if(el.disabled)return;S.view=el.dataset.v;S.leg=false;S.msg="";if(S.view==="pedidos")await carregarLista();render()}
  else if(el=t.closest("[data-a]"))act(el.dataset.a);
  else if(t.id==="bLeg")act("leg");
  else if(t.id==="bWide"){S.wide=!S.wide;janela(S.wide);render()}});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g[tabindex],tr[tabindex]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
$("estilo").addEventListener("change",e=>{[S.tema,S.cor]=e.target.value.split("-");render()});
setInterval(()=>fetch("/api/ping").then(()=>{if(QUEDA){QUEDA=false;render()}}).catch(()=>{if(!QUEDA){QUEDA=true;render()}}),8000);
(async function(){const q=new URLSearchParams(location.search),p=q.get("p");
  if(q.get("exp")){S.view="exp";S.fase=Math.min(8,Math.max(0,+q.get("f")||0));render()}
  if(location.search)history.replaceState(null,"",location.pathname);
  await carregarLista();
  if(p)await abrirPedido(p);else if(S.view!=="exp")render()})();
document.addEventListener("click",e=>{const b=e.target.closest("[data-dl]");if(b){e.stopPropagation();e.preventDefault();abrirArq(b.dataset.dl)}},true);
document.addEventListener("click",async e=>{const b=e.target.closest("[data-del]");if(!b)return;e.stopPropagation();e.preventDefault();if(b.dataset.conf!=="1"){b.dataset.conf="1";b.textContent="Confirmar: apagar de vez";return}try{await api("/api/apagar_pedido",{id:b.dataset.del});if(PED&&PED.id===b.dataset.del){PED=null;S.view="pedidos"}S.msg="Pedido apagado deste aparelho.";await carregarLista();render()}catch(x){S.msg=x.message;render()}},true);
</script>
</body>
</html>
