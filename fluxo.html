  --s0:#E8688A;--s1:#9478DE;--s2:#C76BD1;--s3:#5B9BD8;--s4:#E8935A;--s5:#4FA882;--f:"Nunito","Segoe UI",system-ui,sans-serif;--pes:700}
.app[data-tema="serio"]{--bg:#f6f7f9;--card:#fff;--txt:#1d2430;--muted:#5b6575;--line:#e2e6ec;--accent:#1f5fa8;--sobre:#fff;--out:#13915a;--feito-bg:#dff1e7;
  --alerta-bg:#fff0d9;--alerta-txt:#8a4b00;--aviso-bg:#fdecec;--aviso-txt:#8f1d1d;--vez-bg:#dbe8f8;--bar:#1f5fa8;--bar-txt:#fff;--sel:#1d2430;
  --c0:#d9e7f7;--c1:#e4e1f6;--c2:#eee3f1;--c3:#d6efe9;--c4:#fbe8cc;--c5:#deeeda;
  --s0:#1f5fa8;--s1:#5a55b5;--s2:#8e5aa8;--s3:#1f8f86;--s4:#c07a12;--s5:#3f8f4a;--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--pes:600}
.app{width:640px;max-width:100%;height:672px;margin:0 auto;background:var(--bg);color:var(--txt);font-family:var(--f);border-radius:12px;
  border:1px solid var(--line);box-shadow:0 6px 24px rgba(29,36,48,.16);overflow:hidden;display:flex;flex-direction:column}
.app.wide{width:1240px;height:760px}
button,select,input{font:inherit}
button{cursor:pointer;color:var(--txt)}
:is(button,a,select,input,[tabindex="0"]):focus-visible{outline:2px solid var(--sel);outline-offset:1px}
/* barra e contexto */
.bar{background:var(--bar);color:var(--bar-txt);display:flex;align-items:stretch;gap:10px;padding:0 8px 0 10px;flex:none}
.bar>b{align-self:center;font-size:1.02rem;font-weight:var(--pes)}.bar .sp{flex:1}
.bar>button{align-self:center;padding:2px 9px;background:transparent;color:var(--bar-txt);border:1px solid rgba(255,255,255,.45);border-radius:7px;font-size:.88rem}
.abas{display:flex;gap:2px;align-self:flex-end}
.abas button{border:0;background:none;color:var(--bar-txt);opacity:.82;padding:5px 9px 4px;margin-top:6px;border-radius:7px 7px 0 0;font-size:.88rem}
.abas button[aria-selected="true"]{background:var(--card);color:var(--txt);opacity:1;font-weight:var(--pes)}
.ctx{display:flex;align-items:center;gap:8px;padding:3px 10px;background:var(--card);border-bottom:1px solid var(--line);font-size:.86rem;flex:none}
.ctx .id{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res{display:flex;gap:4px;flex:none}
.res>*{font-size:.78rem;border-radius:999px;padding:0 8px;border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
.res .ok{background:var(--feito-bg);border-color:transparent;color:var(--txt)}
.res .w{background:var(--alerta-bg);border-color:var(--alerta-txt);color:var(--alerta-txt);font-weight:var(--pes)}
/* corpo */
.corpo{flex:1;min-height:0;padding:6px;display:flex;flex-direction:column;gap:5px}
.corpo.duo{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr)}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 9px;min-width:0;display:flex;flex-direction:column;gap:5px}
.cresce{flex:1;min-height:0}.rol{overflow:auto}
.fh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:none}
.fh h2{font-size:.95rem;font-weight:var(--pes);margin:0;flex:1}
/* voltar: seta no alto à direita (com dica) e "Voltar" por extenso no fim da página */
.volta{display:inline-grid;place-items:center;width:28px;height:24px;padding:0;border:1px solid var(--accent);border-radius:7px;background:var(--card);color:var(--accent);flex:none}
.volta:hover{background:var(--accent);color:var(--sobre)}
.voltx{display:inline-flex;align-items:center;gap:5px;padding:3px 12px;border:1px solid var(--accent);border-radius:7px;background:var(--card);color:var(--accent);font-weight:var(--pes);font-size:.88rem}
.voltx:hover{background:var(--accent);color:var(--sobre)}
.pe{display:flex;justify-content:flex-start;padding-top:6px;margin-top:auto}
.refs{display:flex;flex-direction:column;gap:2px;background:color-mix(in srgb,var(--accent) 7%,var(--card));border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:5px 9px;font-size:.86rem}
.refs a{color:var(--accent);font-weight:var(--pes)}
.minu{display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap;margin-left:6px}
.minu button{padding:0 8px;border-radius:6px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:var(--pes);font-size:.8rem}
.minu button.pri{color:var(--sobre)}
.obs{font-size:.82rem;color:var(--muted);font-style:italic;margin:0}
.mini{padding:0 8px;font-size:.8rem;border:1px solid var(--line);border-radius:7px;background:var(--card)}
.mini[aria-pressed="true"]{background:var(--bg);border-color:var(--accent);font-weight:var(--pes)}
p{margin:0}
.nota{color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.aviso{background:var(--aviso-bg);color:var(--aviso-txt);border-radius:8px;padding:5px 9px}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
abbr{text-decoration:underline dotted;text-underline-offset:2px;cursor:help}
h4{margin:2px 0 0;font-size:.78rem;font-weight:var(--pes);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
/* trilho das fases */
.trilho{display:flex;align-items:center;gap:3px;flex:none}
.trilho .ev{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--txt);background:var(--card);flex:none}
.trilho .ev.fim{border-width:3.5px}
.trilho i{flex:none;width:5px;height:1.4px;background:var(--txt)}
.trilho button{flex:none;min-width:30px;height:24px;padding:0 6px;border:1.4px solid var(--txt);border-radius:6px;background:var(--card);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trilho .done{background:var(--feito-bg);border-color:var(--out)}
.trilho .wait{background:var(--alerta-bg);border-color:var(--alerta-txt)}
.trilho .cur{background:var(--vez-bg);border-color:var(--accent)}
.trilho .na{opacity:.45;border-style:dashed}
.trilho .ab{flex:1;min-width:0;text-align:left;font-weight:var(--pes);border-width:2.4px}
/* fluxo vertical (meia tela) */
.fluxo{display:flex;flex-direction:column}
.ps{display:grid;grid-template-columns:88px 24px minmax(0,1fr);gap:0 4px;align-items:start}
.setor,.tag{display:inline-block;font-size:11px;border-radius:999px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ps .setor{justify-self:end;margin-top:6px}
.b0{background:var(--c0)}.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.b4{background:var(--c4)}.b5{background:var(--c5)}
.app[data-cor="mais"] .b0{background:var(--s0);color:#fff}.app[data-cor="mais"] .b1{background:var(--s1);color:#fff}.app[data-cor="mais"] .b2{background:var(--s2);color:#fff}
.app[data-cor="mais"] .b3{background:var(--s3);color:#fff}.app[data-cor="mais"] .b4{background:var(--s4);color:#fff}.app[data-cor="mais"] .b5{background:var(--s5);color:#fff}
.esp{position:relative;align-self:stretch;display:flex;justify-content:center}
.esp::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1.6px;margin-left:-.8px;background:var(--txt)}
.mc{position:relative;margin-top:5px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--txt);background:var(--card);display:grid;place-items:center;font-size:11px;font-weight:var(--pes);line-height:1}
.mc.done{background:var(--feito-bg);border-color:var(--out)}.mc.wait{background:var(--alerta-bg);border-color:var(--alerta-txt);color:var(--alerta-txt)}
.mc.cur{background:var(--vez-bg);border-color:var(--accent);border-width:2.4px}
.mc.gw{border-radius:2px;transform:rotate(45deg);width:16px;height:16px;margin-top:8px}.mc.gw span{transform:rotate(-45deg);font-size:13px}
.mc.tm{box-shadow:inset 0 0 0 2px var(--card),inset 0 0 0 3px var(--txt)}
.tc{margin:2px 0;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:7px;background:var(--card);min-width:0;overflow:hidden}
.tc.done{background:var(--feito-bg)}.tc.wait{background:var(--alerta-bg)}.tc.cur{background:var(--vez-bg)}.tc.skip{opacity:.4}
.tc.sel{box-shadow:0 0 0 2px var(--sel)}
.cab{display:flex;align-items:center;gap:6px;width:100%;padding:4px 8px;border:0;background:none;text-align:left;font-weight:var(--pes);font-size:13px}
.cab>span:first-child{flex:1;min-width:0}
.cab small{font-weight:400}
.corp{background:var(--card);border-top:1px solid var(--line);padding:5px 8px 7px;display:flex;flex-direction:column;gap:5px}
.docic{flex:none;width:9px;height:12px;background:var(--accent);clip-path:polygon(0 0,62% 0,100% 28%,100% 100%,0 100%)}
/* checklist do passo */
.passos{list-style:none;margin:0;padding:0;counter-reset:p;display:flex;flex-direction:column}
.passos li{counter-increment:p;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 0;border-bottom:1px solid var(--line)}
.passos li:last-child{border-bottom:0}
.passos li::before{content:counter(p);flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted);font-size:.74rem;font-weight:var(--pes);display:grid;place-items:center;color:var(--muted)}
.passos li.ok::before{content:"✓";background:var(--feito-bg);border-color:var(--out);color:var(--txt)}
.passos li.ok>span{color:var(--muted)}
.passos li>span{flex:1 1 220px;min-width:0}
.ramo{display:flex;gap:8px;align-items:center}
.passos button,.passos input,.ramo button,.botoes button{padding:2px 10px;border-radius:7px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:var(--pes);font-size:.88rem}
.passos input{width:150px;background:var(--card);color:var(--txt);border-color:var(--line);font-weight:400}
.pri{background:var(--accent)!important;color:var(--sobre)!important}
.lnk{border-color:transparent!important;text-decoration:underline;text-underline-offset:3px}
.botoes{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
dl{margin:0;display:grid;grid-template-columns:minmax(92px,auto) 1fr;gap:2px 10px}
dt{color:var(--muted);font-size:.82rem}dd{margin:0}
.falta{background:var(--alerta-bg);color:var(--alerta-txt);border-radius:6px;padding:0 7px;font-size:.78rem}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:8px;border-bottom:1px solid var(--line);padding:2px 0}
.hist time{color:var(--muted);font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
/* painel (tela larga) */
.pt{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pt h3{margin:0;font-size:1.05rem;font-weight:var(--pes);line-height:1.2;text-wrap:balance}
.st{font-size:11px;border-radius:999px;padding:0 8px;border:1px solid var(--line);white-space:nowrap}
.st.done{background:var(--feito-bg);border-color:transparent}.st.wait{background:var(--alerta-bg);border-color:transparent;color:var(--alerta-txt)}
.st.cur{background:var(--accent);border-color:var(--accent);color:var(--sobre);font-weight:var(--pes)}
.sc{display:grid;place-items:center;min-height:0}.sc svg{display:block}
/* mapa do processo */
.mapa{display:flex;flex-direction:column;gap:3px;flex:1;min-height:0;overflow:auto}
.mfa{flex:1;display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;padding:2px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.mfa.at{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}.mfa.na{opacity:.5}
.nm{border:0;background:none;text-align:left;font-weight:var(--pes);font-size:12.5px;padding:0}
.nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.seq{display:flex;flex-wrap:wrap;gap:3px 2px;align-items:center}
.no{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:1px 6px;background:var(--card)}
.no.done{background:var(--feito-bg)}.no.wait{background:var(--alerta-bg)}.no.cur{background:var(--vez-bg);font-weight:var(--pes)}.no.skip{opacity:.4}
.no.sel{box-shadow:0 0 0 2px var(--sel)}
/* tarefa de outro setor: aparece só para entender o caminho; dúvida em aberto em amarelo */
.outro{margin:0;background:color-mix(in srgb,var(--muted) 9%,var(--card));border:1px dashed var(--muted);border-radius:7px;padding:3px 8px;font-size:.84rem;color:var(--txt)}
.duvida{margin:0;background:#FFF3A3;border-left:4px solid #E0B400;border-radius:6px;padding:3px 8px;font-size:.84rem;color:#4A3B00}
.tc.alh{border-style:dashed;border-left-style:solid}.no.alh{border-style:dashed;border-left-style:solid}
.alhx{font-size:10px;border:1px dashed var(--muted);border-radius:999px;padding:0 6px;color:var(--muted);margin-left:4px;font-weight:400;white-space:nowrap}
.nd.alh .sh{stroke-dasharray:4 2.5}.sh.fim{stroke-width:3.2}.mc.fim{border-width:3.4px}
/* tabelas */
table{border-collapse:collapse;font-size:.88rem;width:100%}
td,th{padding:3px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:var(--pes)}
td small{display:block;color:var(--muted)}
td.arq{overflow-wrap:anywhere}
td.nao{color:var(--muted)}
tr.dif td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tr.dif td{background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.selo{font-size:10px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 6px;margin-left:4px;white-space:nowrap}
tr.clicavel{cursor:pointer}tr.clicavel:hover td{background:var(--bg)}
.leg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 16px}
.leg div{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center}.leg b{display:block}
#tip{position:fixed;z-index:50;max-width:300px;background:#1d2430;color:#fff;border-radius:7px;padding:6px 9px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none}
/* desenho BPMN (tela larga) */
svg text{font-family:var(--f);fill:var(--txt)}
.mkf{fill:var(--txt)}.mko{fill:var(--card);stroke:var(--txt)}
.pool,.poolx{fill:var(--bg);stroke:var(--muted)}
.ln{fill:var(--card);stroke:var(--muted);stroke-width:.8}.lb{stroke:var(--muted);stroke-width:.8}
.c0{fill:var(--c0)}.c1{fill:var(--c1)}.c2{fill:var(--c2)}.c3{fill:var(--c3)}.c4{fill:var(--c4)}.c5{fill:var(--c5)}
.s0{fill:var(--s0)}.s1{fill:var(--s1)}.s2{fill:var(--s2)}.s3{fill:var(--s3)}.s4{fill:var(--s4)}.s5{fill:var(--s5)}
.app[data-cor="mais"] .ln.k0{fill:color-mix(in srgb,var(--c0) 40%,var(--card))}.app[data-cor="mais"] .ln.k1{fill:color-mix(in srgb,var(--c1) 40%,var(--card))}
.app[data-cor="mais"] .ln.k2{fill:color-mix(in srgb,var(--c2) 40%,var(--card))}.app[data-cor="mais"] .ln.k3{fill:color-mix(in srgb,var(--c3) 40%,var(--card))}
.app[data-cor="mais"] .ln.k4{fill:color-mix(in srgb,var(--c4) 40%,var(--card))}.app[data-cor="mais"] .ln.k5{fill:color-mix(in srgb,var(--c5) 40%,var(--card))}
.app[data-cor="mais"] .cartao.pn{border-top:4px solid var(--accent)}
.lbt{font-weight:var(--pes)}
.ed{fill:none;stroke:var(--txt);stroke-width:1.2}.mf{fill:none;stroke:var(--txt);stroke-width:1.1;stroke-dasharray:5 3}
.edl{font-size:10px;font-weight:var(--pes);fill:var(--sel)}
.nd{cursor:pointer}.sh,.shx{fill:var(--card);stroke:var(--txt);stroke-width:1.2}
.nd.done .sh{fill:var(--feito-bg);stroke:var(--out)}.nd.wait .sh{fill:var(--alerta-bg);stroke:var(--alerta-txt)}
.nd.cur .sh{fill:var(--vez-bg);stroke:var(--accent);stroke-width:2.6}
.nd.skip{opacity:.32}.nd.sel .sh{stroke:var(--sel);stroke-width:3}
.nd text{font-weight:var(--pes)}.mk{fill:none;stroke:var(--txt);stroke-width:1.6}.mk1{fill:none;stroke:var(--txt);stroke-width:1}
.ev{fill:var(--card);stroke:var(--txt);stroke-width:1.4}.ev.end{stroke-width:3.6}
.dob{fill:var(--card);stroke:var(--muted);stroke-width:1}.dob.on{fill:var(--accent);stroke:var(--accent)}
.ck{fill:var(--out)}.wt{fill:var(--alerta-txt)}.bw{fill:none;stroke:#fff;stroke-width:1.6}
@media (max-width:520px){
  .app,.app.wide{height:auto;min-height:480px}.rol,.mapa{overflow:visible}
  .bar{flex-wrap:wrap;padding-top:4px}.abas{order:3;width:100%;flex-wrap:wrap}
  .ctx{flex-wrap:wrap}.ps{grid-template-columns:70px 22px minmax(0,1fr)}
  .mfa{grid-template-columns:1fr}dl{grid-template-columns:1fr}
}

.trilho .ab>span:first-child{overflow:hidden;text-overflow:ellipsis}
.ct{background:rgba(255,255,255,.26);border-radius:999px;padding:0 8px;font-size:11px;font-weight:400}
.ps{align-items:center;grid-template-columns:62px 24px minmax(0,1fr)}

.cab{padding:6px 9px;gap:8px}
.dc{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.docic{opacity:.45}.docic.on{opacity:1}
.rm{font-size:11px;font-weight:400;border:1px solid var(--line);border-radius:6px;padding:0 7px;background:var(--card);white-space:nowrap}

/* na ferramenta a janela é o próprio aplicativo: ocupa tudo, sem moldura */
html,body{height:100%}
body{padding:0;background:#fff}
.app,.app.wide{width:100%;max-width:none;height:100vh;margin:0;border:0;border-radius:0;box-shadow:none}
.app.wide{height:auto;min-height:100vh}
.abas button:disabled{opacity:.4;cursor:default}
.abas button{padding-left:5px;padding-right:5px;font-size:.82rem;white-space:nowrap}
th.selc,td.selc{width:26px;text-align:center;cursor:default}.selc input{width:15px;height:15px;margin:0;cursor:pointer}
#bApagar{padding:2px 10px;border-radius:7px;border:1px solid var(--aviso-txt);background:var(--card);color:var(--aviso-txt);font-weight:var(--pes);font-size:.86rem}
#bApagar:disabled{opacity:.45;cursor:default}#bApagar[data-conf="1"]{background:var(--aviso-txt);color:#fff}
/* meia tela: as seis abas, o ? e o Ampliar cabem numa linha */
.bar{gap:6px}.abas{min-width:0;overflow-x:auto;scrollbar-width:none}
@media (max-width:760px){.abas button{font-size:.75rem;padding-left:4px;padding-right:4px}.bar>b{font-size:.92rem}.bar>button{padding:1px 6px;font-size:.8rem}}
.expf{display:flex;flex-direction:column;gap:5px;padding:7px 0;border-top:1px solid var(--line)}
.expf h3{margin:0;font-size:1rem;font-weight:var(--pes)}
.expf .sc{overflow-x:auto;display:block;place-items:start}.expf .sc svg{min-width:520px}
.expp{border-left:4px solid var(--line);padding:2px 0 2px 8px;display:flex;flex-direction:column;gap:2px}
/* janela do processo (/fluxo?bpmn=1): o fluxograma inteiro em tamanho de leitura, com os setores fixos à esquerda e as fases fixas no alto */
html.sobpmn,body.sobpmn{height:100%;margin:0;overflow:hidden;background:#f6f7f9!important}
.sobpmn .bar,.sobpmn .ctx{display:none}
.sobpmn .app,.sobpmn .app.wide{height:100vh!important;min-height:0!important;display:flex;flex-direction:column;background:#f6f7f9;border:0;border-radius:0;box-shadow:none}
.sobpmn .corpo{flex:1;min-height:0;padding:0;gap:0;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:6px;padding:8px 12px;flex:none;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.pbar h1{margin:0 auto 0 0;font-size:15px;font-weight:700;color:#1d2430;white-space:nowrap}
.pbar button{font:inherit;font-size:12px;font-weight:600;height:26px;padding:0 10px;border:1px solid #e2e6ec;background:#fff;color:#1d2430;border-radius:6px;cursor:pointer;white-space:nowrap}
.pbar button:hover{background:#eef3fa;border-color:#b9cde6}
.pbar button[aria-pressed=true]{background:#1d2430;color:#fff;border-color:#1d2430}
.pbar .pseg{display:flex;gap:4px;margin-right:10px}
.pbar .zm{width:28px;padding:0;font-size:14px}
.pbar .zv{font-size:11.5px;color:#5b6575;min-width:40px;text-align:center}
#bps{flex:1;min-height:0;overflow:auto;margin:0 12px 12px;border:1px solid #e2e6ec;border-radius:8px;background:#fff;cursor:grab;user-select:none;-webkit-user-select:none;position:relative;overscroll-behavior:contain}
#bps.arr,#bps.arr *{cursor:grabbing!important}
.pg{display:grid;position:relative;width:max-content}
.pg>svg{display:block;max-width:none!important;margin:0!important}
#pCan{position:sticky;top:0;left:0;z-index:3;background:#f1f5fb;border-right:1px solid #e2e6ec;border-bottom:1px solid #e2e6ec;box-sizing:border-box}
#pTop{position:sticky;top:0;z-index:2;background:#f1f5fb;border-bottom:1px solid #e2e6ec}
#pLad{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid #e2e6ec;box-shadow:3px 0 6px rgba(29,36,48,.07)}
.sobpmn g:focus:not(:focus-visible){outline:none}
.fx{cursor:pointer}.fx rect{fill:#dbe8f8;stroke:#9db8dc;stroke-width:.8}.fx text{fill:var(--txt);font-weight:600}
.fx.at rect{fill:var(--accent);stroke:var(--accent)}.fx.at text{fill:var(--sobre)}
#pDet{flex:none;margin:0 12px 12px;background:#fff;border:1px solid #e2e6ec;border-left:5px solid var(--accent);border-radius:8px;padding:9px 12px;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;font-size:12.5px;line-height:1.4;color:#1d2430;max-height:36vh;overflow:auto;display:flex;flex-direction:column;gap:5px}
#pDet .dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pDet h2{margin:0;font-size:14px;font-weight:700}
#pDet .fs{color:#5b6575;font-size:11.5px;margin-right:auto}
#pDet p{margin:0}
#pDet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 12px}
#pDet dt{color:#5b6575;font-weight:600}#pDet dd{margin:0}
#pDet button{font:inherit;font-size:12px;font-weight:600;height:26px;padding:0 10px;border:1px solid #e2e6ec;background:#eef3fa;color:#1d2430;border-radius:6px;cursor:pointer}
#pDet button:hover{border-color:#b9cde6;background:#e3ecf7}
#pDet .px{width:26px;padding:0;background:#fff}
a.bt{text-decoration:none;display:inline-block;padding:3px 12px;border-radius:7px;background:var(--accent);color:var(--sobre);font-weight:var(--pes);font-size:.9rem;border:1px solid var(--accent)}
</style>

<script>
/* ---------- organograma (Decreto 39.546/2018, regimento da SES-DF; Portaria SES 473/2023) ---------- */
const ORG={
 ORIGEM:["Setor de origem","Diretoria do setor de origem","O setor que percebeu a necessidade e abre o processo: uma gerência da atenção primária ou outra área da SES. Consolida o interesse das gerências, monta o TR e acompanha o processo até a entrega.","Colegiado 23/11/2026"],
 DIRORIG:["Diretoria do setor de origem","Superintendência","A diretoria à qual o setor de origem responde. No PDPAS, repassa a intenção a todas as gerências e assina o TR. Na atenção primária da Região Norte, é a DIRAPS.","Colegiado 23/11/2026; Regimento, art. 325"],
 GSAPS:["Gerência de Serviços de Atenção Primária à Saúde","DIRAPS","Gere as UBS do seu território. Identifica e pede à região o que falta de material, equipamento e infraestrutura, e controla os bens das unidades.","Regimento, art. 334"],
 DIRAPS:["Diretoria Regional de Atenção Primária à Saúde","Superintendência da Região Norte","Dirige a atenção primária da região e define de quais materiais, insumos e equipamentos os serviços precisam. No PDPAS, é a diretoria que abre o processo de compra da atenção primária.","Regimento, art. 325; Manual do PDPAS"],
 GAPAPS:["Gerência de Áreas Programáticas de Atenção Primária à Saúde","DIRAPS","Planeja, acompanha e avalia as políticas e linhas de cuidado da atenção primária.","Regimento, art. 331"],
 SRSNO:["Superintendência da Região de Saúde Norte","Secretário de Saúde","Gere as ações de saúde de Fercal, Planaltina, Sobradinho e Sobradinho II e os recursos financeiros da região. É a unidade que executa o PDPAS.","Regimento, art. 261"],
 DA:["Diretoria Administrativa","Superintendência da Região Norte","Cuida de orçamento, finanças, pessoas, apoio operacional e contratações da região. O Diretor Administrativo é o ordenador de despesa: aprova o TR, autoriza, adjudica e homologa.","Regimento, art. 265; Manual do PDPAS"],
 GEOF:["Gerência de Orçamento e Finanças","Diretoria Administrativa","Controla o dinheiro transferido pelo Fundo de Saúde, executa as contratações e monta a prestação de contas. No PDPAS, confere os documentos, faz a cotação e instrui a dispensa de licitação.","Regimento, art. 266"],
 NPDOC:["Núcleo de Patrimônio e Documentação Administrativa","Gerência de Apoio Operacional (Diretoria Administrativa)","Recebe, tomba, movimenta e dá baixa em bens patrimoniais. No PDPAS, recebe o bem e a nota fiscal.","Regimento, art. 281"],
 NUAL:["Núcleo de Almoxarifado","Gerência de Apoio Operacional (Diretoria Administrativa)","Recebe, guarda, controla o estoque e distribui os materiais de consumo.","Regimento, art. 279"],
 NLF:["Núcleo de Logística Farmacêutica","Gerência de Apoio Operacional da atenção primária","Planeja, armazena e distribui medicamentos e produtos para saúde nas UBS.","Regimento, art. 277"],
 NECFM:["Núcleo de Engenharia Clínica e Física Médica","Gerência de Apoio Operacional da atenção especializada","Controla a manutenção dos equipamentos médicos. Pelo regimento, só existe nos hospitais, não na atenção primária.","Regimento, art. 278"],
 SINFRA:["Subsecretaria de Infraestrutura em Saúde","Secretário de Saúde","Obras, manutenção dos prédios e manutenção dos equipamentos médicos de toda a Secretaria.","Regimento, art. 249"],
 GEMED:["Gerência de Equipamentos Médicos","Diretoria de Engenharia Clínica (SINFRA)","Elabora pareceres e laudos técnicos sobre compra, recebimento e instalação de equipamentos médicos.","Regimento, art. 259"],
 SUAG:["Subsecretaria de Administração Geral","Secretário de Saúde","Área da Administração Central que analisa a prestação de contas do PDPAS.","Portaria 473, art. 7º, IV"],
 FSDF:["Fundo de Saúde do Distrito Federal","Secretário de Saúde","Libera o dinheiro do PDPAS para a região, desde que as contas anteriores tenham sido prestadas.","Regimento, art. 37; Decreto 44.322, art. 9º"],
 UBS:["Unidade Básica de Saúde","GSAPS","A unidade de atenção primária, onde o item comprado será usado.",""],
 TR:["Termo de Referência","","O documento que descreve o que comprar, quanto, por quê e em que condições.",""],
 SEI:["Sistema Eletrônico de Informações","","Onde o processo tramita e os documentos são assinados.",""],
 PDPAS:["Programa de Descentralização Progressiva de Ações de Saúde","","Dinheiro repassado à região para compras e serviços pequenos e urgentes, sem licitação, dentro de um teto por item.","Decreto 44.322/2023"],
 SisGepat:["Sistema Geral de Patrimônio","","Onde cada bem permanente é registrado com seu número de patrimônio.",""],
 PNCP:["Portal Nacional de Contratações Públicas","","Site federal onde toda contratação pública é divulgada.",""],
 DODF:["Diário Oficial do Distrito Federal","","",""],
 SES:["Secretaria de Estado de Saúde do Distrito Federal","","",""],
 GDF:["Governo do Distrito Federal","","",""],
 APS:["Atenção Primária à Saúde","","",""],
 FGTS:["Fundo de Garantia do Tempo de Serviço","","A empresa precisa estar em dia com ele para contratar com o governo.",""],
 BPMN:["Business Process Model and Notation","","Norma internacional para desenhar processos.",""],
 PDF:["Formato de arquivo de documento","","",""]

const tipOrg=k=>{const o=ORG[k];return o[0]+(o[2]?". "+o[2]:"")};

const by=id=>N.find(n=>n.id===id), v=(x,t)=>x&&typeof x==="object"&&!Array.isArray(x)?x[t]:x;
const lab=(n,t)=>v(n.t,t||S.tipo);

/* ---------- estado: o pedido vem do programa (Processos\<pedido>), a aparência fica neste computador ---------- */
const SH={t1:"Memorando de intenção",t2:"Despacho às gerências",tm:"7 dias úteis",t3:"Consolidado",t4:"Montar o TR",t5:"Assinatura da diretoria",t5s:"Assinatura e envio",t6:"Nada Consta, ata e Visão",g:"Ata vigente?",t7:"Processo para",gs1:"É reparo?",s1:"Ficha e declaração",gs2:"Altera o prédio?",s3:"Anuência da SINFRA",t8:"Parecer técnico",t9:"Aprovar e autorizar",t10:"Cotação e mapa",t11:"Parecer da vencedora",t12:"Certidões",t13:"Adjudicar e emitir Ordem",t14:"Publicar e enviar Ordem",t15:"Receber e Nota Fiscal",t16:"Atesto",t17:"Distribuir",t18:"Pagar e prestar contas",t19:"Tombamento"};

const ESPERA_SALVAR_MS=250,INTERVALO_PING_MS=8000,FAIXA=19;   /* FAIXA: altura das faixas de fase no alto do desenho */
const FN={t1:"1_Memo_intencao",t2:"1b_Despacho_DIRAPS_gerencias",t3:"1c_Despacho_consolidado",t4:"2_Termo_de_Referencia",t11:"5_Parecer_apos_mapa",t16:"6_Atesto"};

let S={tipo:"p",view:"pedidos",fase:0,sel:{k:"x"},sub:"",prev:"",wide:false,leg:false,msg:"",bp:false,tema:"serio",cor:"mais",d:{},ans:{},sei:{},docs:{},arqs:{},h:[]};
async function api(rota,corpo){let r;
  try{r=await fetch(rota,corpo?{method:"POST",headers:{"Content-Type":"application/json","X-Ferramenta":"1"},body:JSON.stringify(corpo)}:undefined)}
  catch(e){
    if(SITE)throw new Error(String(e.message||e).split("\n").pop());   /* a causa real (internet, Python) já vem no aviso da página */
    QUEDA=true;throw new Error("Sem resposta do programa: feche esta janela e abra a ferramenta de novo.")}
  const j=await r.json().catch(()=>({erro:"resposta inválida do programa"}));
  if(!r.ok)throw new Error(j.erro||"erro");return j}
let tSalvar=null,ultimoSalvo="";
function save(){if(!PED)return;const id=PED.id,estado={d:S.d,ans:S.ans,sei:S.sei,h:S.h,fase:S.fase,cancelado:!!S.cancelado},txt=id+JSON.stringify(estado);
  if(txt===ultimoSalvo)return;ultimoSalvo=txt;clearTimeout(tSalvar);
  tSalvar=setTimeout(()=>api("/api/fluxo",{id,estado}).catch(e=>{ultimoSalvo="";S.msg="Não consegui gravar o andamento: "+e.message;render()}),ESPERA_SALVAR_MS)}
/* S.docs guarda a data já escapada (vai direto ao HTML); S.arqs guarda o nome verdadeiro, usado para abrir o arquivo */
function montarDocs(){S.docs={};S.arqs={};
  for(const a of PED.arquivos){for(const id in FN)if(a.nome.startsWith(FN[id]+"_")){S.docs[id]=esc(a.quando);S.arqs[id]=a.nome}
    if(a.nome.startsWith("3_Checklist")){S.docs._ck=esc(a.quando);S.arqs._ck=a.nome}}}
const nomeArq=n=>S.arqs[n.id]||FN[n.id]+".docx";
const arq=n=>esc(nomeArq(n));
const agora=()=>{const d=new Date(),p=x=>String(x).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`};
const path=()=>N.filter(n=>n.tp.includes(S.tipo));
const parou=n=>S.tipo!=="s"&&S.ans.g==="s"&&N.indexOf(n)>N.indexOf(by("t7"));   /* ata vigente: o processo para */
const skip=n=>(n.cond&&S.ans[n.cond]==="n")||parou(n);
const cur=()=>PED?path().find(n=>!skip(n)&&S.d[n.id]!=="d"):undefined;
function stat(n){if(!PED)return "todo";if(skip(n))return "skip";if(S.d[n.id]==="d")return "done";if(S.d[n.id]==="w")return "wait";const c=cur();return c&&c.id===n.id?"cur":"todo"}
const STN={done:"Feito",wait:"Aguardando",cur:"Fazer agora",todo:"A fazer",skip:"Não se aplica"};
const log=(t,id)=>S.h.push([agora(),t,id]);
const larga=()=>!!S.wide;
const fst=f=>{const q=path().filter(n=>n.f===f&&!skip(n)),dn=q.filter(n=>S.d[n.id]==="d").length,c=cur();
  return {q,dn,s:!q.length?"na":dn===q.length?"done":c&&c.f===f?(S.d[c.id]==="w"?"wait":"cur"):"todo"}};
const selFase=f=>{S.fase=f;const c=cur();S.sel=c&&c.f===f?{k:"n",id:c.id}:{k:"x"};S.sub=""};
const REL=`<svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M6,2.5V6.3h3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;
const tipSetor=l=>esc(tipOrg(laneOrg(l)));
const laneCurto=l=>["Origem","Diretoria","SRSNO","Dir. Adm.","GEOF"][l]||laneOrg(5);

/* ---------- peças de tela ---------- */
function resumo(){const p=path().filter(n=>!skip(n)),pc=p.filter(n=>n.k==="peca"),w=p.filter(n=>S.d[n.id]==="w");
  return `<span class="ok" data-tip="Passos já feitos neste pedido.">${p.filter(n=>S.d[n.id]==="d").length}/${p.length} feitos</span>`+(w.length?`<button class="w" data-n="${w[0].id}" data-tip="Passo parado em outro setor. Clique para ir até ele.">${w.length} aguardando</button>`:"")+`<span data-tip="Minutas já geradas, do total que este pedido usa.">${pc.filter(n=>S.docs[n.id]).length}/${pc.length} minutas</span>`}
function trilho(){let a="";
  for(let f=0;f<9;f++){const {q,dn,s}=fst(f),na=s==="na",ab_=S.fase===f;
    const tx=ab_?`<span>${f+1}. ${F[f][0]}</span>${na?"":`<span class="ct">${dn}/${q.length}${s==="wait"?" · aguardando":""}</span>`}`:s==="done"?`${f+1} ✓`:`${f+1}`;
    a+=`<button class="${s}${ab_?" ab":""}" data-f="${f}" aria-pressed="${ab_}" data-tip="${esc((f+1)+". "+F[f][0]+". "+(na?"Não existe neste tipo de compra.":dn+" de "+q.length+" passos feitos."))}">${tx}</button>`}
  return `<div class="trilho" role="group" aria-label="As nove fases do processo">${a}</div>`}
function faseTxt(f){const X=F[f],quem=[...new Set(path().filter(n=>n.f===f).map(n=>laneNome(n.l)))].join(", ");
  return `<p>${ab(X[1])}</p><p class="nota"><b>Entra</b> ${ab(X[2])} → <b>Sai</b> ${ab(X[3])} · <b>Quem faz essa parte?</b> ${ab(quem)}</p>`+(X[4]?`<p class="nota"><b>Atenção</b> ${ab(X[4])}</p>`:"")}
const fal=`<span class="falta" data-tip="Os documentos da ferramenta não dizem. Preencher com a prática da região.">a definir com você</span>`;
const dd=(t,x)=>`<dt>${t}</dt><dd>${x?ab(x):fal}</dd>`;
const avOutro=n=>ehOrigem(n)?"":`<p class="outro"><b>Não é tarefa de quem abre o processo.</b> Quem faz esta parte é ${ab(laneNome(n.l))}. Ela aparece aqui só para você entender o caminho e saber o que esperar.</p>`;
const avDuv=n=>n.du?`<p class="duvida">${ab(n.du)}</p>`:"";
function partes(n){const s=stat(n),q=laneNome(n.l),pd=v(n.pd,S.tipo),dn=s==="done",w=s==="wait";
  const li=(ok,tx)=>`<li class="${ok?"ok":""}"><span>${tx}</span></li>`;
  const seiIn=`<input type="text" id="sei" placeholder="nº SEI" aria-label="Número SEI do documento" data-tip="${esc(tipOrg("SEI"))}">`;
  const feito=`Feito${S.sei[n.id]?" · "+ab("SEI")+` <span class="num">${esc(S.sei[n.id])}</span>`:""}`,reab=`<button class="lnk" data-a="reabrir" data-tip="Volta o passo para pendente e registra no histórico.">Reabrir</button>`;
  const x=avOutro(n)+avDuv(n)+(n.av?`<div class="aviso">${ab(n.av)}</div>`:"")+(S.msg?`<p class="nota" role="status">${esc(S.msg)}</p>`:"");
  if(s==="skip")return {l:`<div class="aviso">Este passo não se aplica: a resposta à decisão anterior foi “não”.</div>`,a:"",x:""};
  if(n.kind==="stop")return {l:`<div class="aviso">${ab(v(n.e,S.tipo))}</div>`,a:dn?reab:`<button class="pri" data-a="feito">Encerrar o pedido</button>`,x};
  if(n.kind==="gw")return {l:`<div class="ramo"><button class="pri" data-a="sim">Sim</button><span>${ab(n.sim)}</span></div><div class="ramo"><button class="pri" data-a="nao">Não</button><span>${ab(n.nao)}</span></div>`+(S.ans[n.id]?`<p class="nota">Resposta registrada: ${S.ans[n.id]==="s"?"sim":"não"}.</p>`:""),a:"",x};
  if(n.kind==="timer")return {l:`<ol class="passos">${li(dn,"<b>Esperar</b> a data-limite escrita no despacho")}</ol>`,a:dn?reab:`<button class="pri" data-a="feito">O prazo terminou</button>`,x};
  if(n.k==="peca"){const d=S.docs[n.id];
    return {l:`<ol class="passos">`+li(!!d,d?`<b>Minuta gerada</b>: ${arq(n)} <span class="nota num">${d}</span>`:`<b>Gerar</b> a minuta: ${ab(n.doc)}`)+li(dn,`<b>Incluir no ${ab("SEI")}</b>: revisar no Word, incluir no processo e assinar`)+li(dn,dn?feito:`<b>Concluir</b>: anotar o número do documento`)+`</ol>`,
      a:(d?`<button data-a="abrir">Baixar uma nova cópia (Word)</button><button class="lnk" data-a="minuta">Gerar de novo</button>`:`<button class="pri" data-a="minuta">Gerar a minuta</button>`)+(dn?reab:seiIn+`<button class="${d?"pri":""}" data-a="feito">Marcar como feito</button>`),
      x:x+(n.dv?`<p class="nota"><b>Depois</b>: ${ab(n.dv)}</p>`:"")}}
  const h=S.h.filter(y=>y[2]===n.id&&/^Pedido/.test(y[1])).pop();
  return {l:`<ol class="passos">`+li(w||dn,(ehOrigem(n)?`<b>Pedir</b> (${ab(q)}): ${pd?ab(pd):fal}`:`<b>Com ${ab(q)}</b>: o processo chega lá pelo SEI; não é preciso pedir nada`)+(w&&h?` <span class="nota num">· ${esc(String(h[0]).slice(0,5))}</span>`:""))+li(dn,`<b>Esperar</b>: ${n.vt?ab(n.vt):fal}`+(n.pz?` <span class="nota">Prazo: ${ab(n.pz)}</span>`:""))+li(dn,dn?feito:`<b>Ao voltar</b>: ${n.dv?ab(n.dv):"registrar a devolutiva"}`)+`</ol>`,
    a:dn?reab:w?seiIn+`<button class="pri" data-a="feito">Registrar devolutiva</button>`:`<button class="pri" data-a="pedi" data-tip="Registra a data. O passo fica como aguardando.">${ehOrigem(n)?"Registrar que pedi":"Registrar que foi para lá"}</button>`+seiIn+`<button data-a="feito">Registrar devolutiva</button>`,x}}
function detFull(n){const o=ORG[laneOrg(n.l)],ext=n.k==="acompanha"||n.k==="confere";

function ramos(n){const p=path(),i=p.indexOf(n),B=p[i+1],C=p[i+2];
  return `<span class="rm">Sim: ${esc(B?SH[B.id]:"segue")}</span><span class="rm">Não: ${esc(!C?"fim":C.f===n.f?SH[C.id]:"Fase "+(C.f+1))}</span>`}
function fluxo(f){const q=path().filter(n=>n.f===f);if(!q.length)return `<div class="aviso">Esta fase não existe em ${TIPO[S.tipo].toLowerCase()}.</div>`;
  let a="",i=0;
  for(const n of q){const s=stat(n),sel=S.sel.k==="n"&&S.sel.id===n.id,gw=n.kind==="gw",h=dica(n,s);if(n.kind==="task")i++;
    const dir=gw&&!sel?ramos(n):(h&&(s==="done"||s==="todo")?`<span class="dc">${n.k==="peca"?`<span class="docic${S.docs[n.id]?" on":""}"></span>`:""}${h}</span>`:`<span class="st ${s}">${STN[s]}</span>`);
    a+=`<div class="ps"><span class="setor b${n.l}" tabindex="0" data-tip="${esc(laneNome(n.l)+": ")+tipSetor(n.l)}">${laneCurto(n.l)}</span><span class="esp">${marca(n,s,i)}</span>`
      +`<div class="tc ${s}${sel?" sel":""}${gw?" gwc":""}${ehOrigem(n)?"":" alh"}" style="border-left-color:var(--s${n.l})"><button class="cab" data-n="${n.id}" aria-expanded="${sel}"><span>${gw?"◇ ":n.kind==="task"?i+". ":""}${ab(gw?n.q:lab(n))}${n.cond?` <small class="nota">se sim</small>`:""}${ehOrigem(n)?"":`<small class="alhx" data-tip="Não é tarefa de quem abre o processo: aparece só para mostrar o caminho.">outro setor</small>`}</span>${dir}</button>`;
    if(sel){const P=partes(n);a+=`<div class="corp">${P.l}<div class="acoes">${P.a}${tg("Detalhes","Histórico")}</div>${P.x}${extra(n)}</div>`}
    a+=`</div></div>`}
  return `<div class="fluxo">${a}</div>`}
/* fase anterior que existe neste tipo de compra; na primeira, volta à lista de pedidos */
function faseAnterior(){for(let f=S.fase-1;f>=0;f--)if(path().some(n=>n.f===f))return f;return -1}
function voltaTopo(){const a=faseAnterior(),t=a<0?"Voltar à lista de pedidos":`Voltar à fase ${a+1}: ${F[a][0]}`;
  return `<button class="volta" data-a="volta" aria-label="${esc(t)}" data-tip="${esc(t)}"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13 8H3.5M7.5 3.5L3 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
function voltaPe(){const a=faseAnterior();return `<div class="pe"><button class="voltx" data-a="volta" data-tip="${esc(a<0?"Voltar à lista de pedidos":`Voltar à fase ${a+1}: ${F[a][0]}`)}"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13 8H3.5M7.5 3.5L3 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Voltar</button></div>`}
function pedidoEstreito(){const f=S.fase;
  return trilho()+`<div class="cartao cresce rol"><div class="fh"><h2>Fase ${f+1}: ${F[f][0]}</h2><button class="mini" data-a="fase" aria-pressed="${S.sel.k==="f"}" data-tip="Para que serve esta fase, o que entra, o que sai e onde costuma travar.">Entenda a fase</button><button class="mini" data-a="bpmn" aria-pressed="${!!S.bp}" data-tip="Mostra ou recolhe o fluxograma com raias desta fase.">${S.bp?"Recolher o fluxograma":"Ver fluxograma BPMN"}</button>${voltaTopo()}</div>`
    +(S.sel.k==="f"?`<div class="caixa">${faseTxt(f)}</div>`:"")+(S.bp&&path().some(n=>n.f===f)?`<div class="sc">${diagram(path().filter(n=>n.f===f))}</div>`:"")+fluxo(f)+voltaPe()+`</div>`}

/* ---------- aba Pedido, tela larga: BPMN horizontal + painel ---------- */
function wrap(s,m){const o=[];let c="";for(const x of s.split(" ")){if(c&&(c+" "+x).length>m){o.push(c);c=x}else c=c?c+" "+x:x}o.push(c);return o}
function tx(lines,cx,cy,fs,cls){const lh=fs+1.5,y0=cy-(lines.length-1)*lh/2+fs*.35;return `<text class="${cls||""}" text-anchor="middle" font-size="${fs}">`+lines.map((l,i)=>`<tspan x="${cx}" y="${y0+i*lh}">${esc(l)}</tspan>`).join("")+"</text>"}
const WD={task:96,gw:30,start:16,end:18,timer:24,stop:84},TH=38,LH=70,GAP=18,PW=15,LW=72;
function diagram(ns){
  const seq=[{id:"_s",kind:"start",l:ns[0].l},...ns,{id:"_e",kind:"end",l:ns[ns.length-1].l}];
  const lanes=[...new Set(ns.map(n=>n.l))].sort(),pools=[...new Set(ns.filter(n=>n.msg).map(n=>n.msg[0]))],P=new Map();let x=PW+LW+12,W=0;
  for(const n of seq){const w=WD[n.kind];P.set(n.id,{x,w,r:x+w,cx:x+w/2,cy:lanes.indexOf(n.l)*LH+LH/2});W=x+w+10;x+=w+(n.kind==="gw"?36:GAP)}
  const HL=lanes.length*LH,py=k=>HL+7+pools.indexOf(k)*26,H=HL+(pools.length?7+pools.length*26:0),g=GAP/2,r=15;let a="";
  a+=`<rect class="pool" x="0" y="0" width="${W}" height="${HL}"/><text class="lbt" font-size="9" text-anchor="middle" transform="translate(${PW/2+3},${HL/2}) rotate(-90)">${HL>130?"Região de Saúde Norte":"Região Norte"}</text>`;
  lanes.forEach((l,i)=>{const y=i*LH;a+=`<rect class="ln k${l}" x="${PW}" y="${y}" width="${W-PW}" height="${LH}"/><g data-tip="${tipSetor(l)}" tabindex="0"><rect class="lb c${l}" x="${PW}" y="${y}" width="${LW}" height="${LH}"/><rect class="s${l}" x="${PW}" y="${y}" width="4" height="${LH}"/>${tx(laneTxt(l),PW+LW/2+2,y+LH/2,10.5,"lbt")}</g>`});
  pools.forEach(k=>{a+=`<g tabindex="0" data-tip="${esc(k==="central"?"Áreas técnicas e de controle da Secretaria, fora da região."+sg("SES SUAG SINFRA GEMED"):"A empresa que vende o item ou presta o serviço.")}"><rect class="poolx" x="0" y="${py(k)}" width="${W}" height="20"/><text class="lbt" font-size="10" x="8" y="${py(k)+14}">${PX[k]}</text></g>`});
  const E=d=>`<path class="ed" d="${d}" marker-end="url(#a1)"/>`;
  for(let i=0;i<seq.length-1;i++){const A=seq[i],B=seq[i+1],pa=P.get(A.id),pb=P.get(B.id);if(A.kind==="stop")continue;   /* o processo para: nada sai dali */
    if(A.kind==="gw"){const pc=P.get(seq[i+2].id);
      if(pb.cy===pa.cy){const yb=pa.cy+TH/2+12,C=seq[i+2],em=B.kind==="stop"&&pc.cy===pa.cy;   /* depois de "o processo para", o Não entra por baixo, para não parecer que sai do fim */
        a+=E(`M${pa.r},${pa.cy} H${pb.x}`)+E(em?`M${pa.cx},${pa.cy+r} V${yb} H${pc.cx} V${pc.cy+(C.kind==="task"?TH/2:C.kind==="gw"?r:7)}`:`M${pa.cx},${pa.cy+r} V${yb} H${pc.x-g} V${pc.cy} H${pc.x}`)+`<text class="edl" x="${pa.r+5}" y="${pa.cy-4}">Sim</text><text class="edl" x="${pa.cx+5}" y="${pa.cy+r+9}">Não</text>`}
      else{const up=pb.cy<pa.cy;a+=E(`M${pa.cx},${pa.cy+(up?-r:r)} V${pb.cy} H${pb.x}`)+E(`M${pa.r},${pa.cy} H${pc.x-g} V${pc.cy} H${pc.x}`)+`<text class="edl" x="${pa.cx+5}" y="${pa.cy+(up?-r-3:r+10)}">Sim</text><text class="edl" x="${pa.r+5}" y="${pa.cy-4}">Não</text>`}}
    else a+=E(`M${pa.r},${pa.cy} H${pa.r+g} V${pb.cy} H${pb.x}`)}
  for(let i=0;i<seq.length;i++){const n=seq[i],p=P.get(n.id);
    if(n.kind==="start"){a+=`<circle class="ev" cx="${p.cx}" cy="${p.cy}" r="7" data-tip="Início desta fase."/>`;continue}
    if(n.kind==="end"){a+=`<circle class="ev end" cx="${p.cx}" cy="${p.cy}" r="7" data-tip="Fim desta fase."/>`;continue}
    const s=stat(n),sel=S.sel.k==="n"&&S.sel.id===n.id,tip=esc((ehOrigem(n)?"":"Não é tarefa de quem abre o processo. ")+lab(n)+". "+STN[s]+". Quem faz essa parte? "+laneNome(n.l)+"."+sg(lab(n)+" "+SH[n.id]+" "+laneOrg(n.l)));
    a+=`<g class="nd ${s}${sel?" sel":""}${ehOrigem(n)?"":" alh"}" data-n="${n.id}" data-tip="${tip}" tabindex="0" role="button" aria-label="${tip}">`;
    if(n.kind==="gw"){const sobe=P.get(seq[i+1].id).cy<p.cy;a+=`<polygon class="sh" points="${p.cx},${p.cy-r} ${p.cx+r},${p.cy} ${p.cx},${p.cy+r} ${p.cx-r},${p.cy}"/><path class="mk" d="M${p.cx-4},${p.cy-4}l8,8M${p.cx+4},${p.cy-4}l-8,8"/>`+tx([SH[n.id]],p.cx,sobe?p.cy+r+10:p.cy-r-7,10)}
    else if(n.kind==="stop")a+=`<circle class="sh fim" cx="${p.x+10}" cy="${p.cy}" r="9"/><text class="lbt" x="${p.x+24}" y="${p.cy+3.5}" font-size="10">${esc(SH[n.id])}</text>`;
    else if(n.kind==="timer")a+=`<circle class="sh" cx="${p.cx}" cy="${p.cy}" r="12"/><circle cx="${p.cx}" cy="${p.cy}" r="9.5" class="mk1"/><path class="mk" stroke-width="1.2" d="M${p.cx},${p.cy-6}V${p.cy}h4"/>`+tx([SH[n.id]],p.cx,p.cy+22,10);
    else{const y=p.cy-TH/2;a+=`<rect class="sh" x="${p.x}" y="${y}" width="${p.w}" height="${TH}" rx="7"/><rect class="s${n.l}" x="${p.x+1.5}" y="${y+4}" width="4" height="${TH-8}" rx="2"/>`+tx(wrap(SH[n.id],13),p.cx+3,p.cy,10.5);
      if(n.doc)a+=`<path class="dob ${S.docs[n.id]?"on":""}" d="M${p.r-13},${y+TH-4}h6l3,3v9h-9z"/>`;
      if(n.msg){const yp=py(n.msg[0]),yt=y+TH,d=n.msg[1];
        if(d!=="in")a+=`<path class="mf" d="M${p.cx-(d==="both"?6:0)},${yt} V${yp}" marker-start="url(#a3)" marker-end="url(#a2)"/>`;
        if(d!=="out")a+=`<path class="mf" d="M${p.cx+(d==="both"?6:0)},${yp} V${yt}" marker-start="url(#a3)" marker-end="url(#a2)"/>`}}
    const bx=n.kind==="task"?p.r-2:n.kind==="stop"?p.x+21:p.cx+11,byy=n.kind==="task"?p.cy-TH/2+2:p.cy-11;
    if(s==="done")a+=`<circle class="ck" cx="${bx}" cy="${byy}" r="6"/><path class="bw" d="M${bx-3},${byy}l2.2,2.4l3.8,-4.6"/>`;
    if(s==="wait")a+=`<circle class="wt" cx="${bx}" cy="${byy}" r="6"/><path class="bw" d="M${bx},${byy-3.5}V${byy}h2.8"/>`;
    a+="</g>"}
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${Math.round(W*1.3)}px;height:auto" role="group" aria-label="Fluxograma da fase">${a}</svg>`}
function painel(n){const s=stat(n),P=partes(n),o=ORG[laneOrg(n.l)];
  return `<div class="pt"><h3>${ab(n.q||SH[n.id])}</h3><span style="flex:1"></span><span class="st ${s}">${STN[s]}</span></div>${P.l}${P.a?`<div class="acoes">${P.a}</div>`:""}${P.x}`
    +`<div class="caixa"><h4>Quem faz essa parte?</h4><p><span class="tag b${n.l}">${laneOrg(n.l)}</span> ${o[0]}. ${ab(o[2])}</p><h4>Base</h4><p>${ab(n.bn)}</p></div><div class="acoes">${tg("Detalhes completos","Histórico")}</div>${extra(n)}`}
function pedidoLargo(){const f=S.fase,q=path().filter(n=>n.f===f),X=F[f];
  if(q.length&&!(S.sel.k==="n"&&q.some(n=>n.id===S.sel.id))){const c=cur();S.sel={k:"n",id:(c&&c.f===f?c:q[0]).id}}
  return `<div class="cartao"><div class="fh"><h2>Fase ${f+1}: ${F[f][0]}</h2>${voltaTopo()}</div>${trilho()}${q.length?`<div class="sc">${diagram(q)}</div>`:`<div class="aviso">Esta fase não existe em ${TIPO[S.tipo].toLowerCase()}.</div>`}<div class="caixa"><p><b>Resumo da Fase ${f+1}:</b> ${ab(X[1])} ${ab(X[4])}</p><p class="nota"><b>Entra</b> ${ab(X[2])} → <b>Sai</b> ${ab(X[3])}</p></div></div>`
    +`<div class="cartao pn">${q.length?painel(by(S.sel.id)):`<p class="nota">Nenhum passo nesta fase.</p>`}${voltaPe()}</div>`}

/* ---------- aba Processo: mapa vertical ---------- */
function mapa(){const p=path(),lg=larga();if(lg&&!(S.prev&&p.some(n=>n.id===S.prev))){const c=cur();S.prev=(c||p[0]).id}
  const rows=F.map((X,f)=>{const q=p.filter(n=>n.f===f),st_=fst(f);
    return `<div class="mfa${S.fase===f?" at":""}${q.length?"":" na"}"><button class="nm" data-ir="${f}" data-tip="Abrir esta fase na aba Pedido.">${f+1}. ${X[0]}</button><div class="seq">`
      +q.map(n=>{const s=stat(n);return `<button class="no ${s}${lg&&S.prev===n.id?" sel":""}${ehOrigem(n)?"":" alh"}" style="border-left-color:var(--s${n.l})" ${lg?"data-pv":"data-n"}="${n.id}" data-tip="${esc(lab(n)+". "+STN[s]+". "+laneNome(n.l)+"."+sg(lab(n)+" "+SH[n.id]+" "+laneOrg(n.l)))}">${s==="done"?"✓":s==="wait"?REL:n.kind==="gw"?"◇":""}${esc(SH[n.id])}</button>`}).join("")
      +`</div><span class="st ${st_.s==="na"?"":st_.s}">${q.length?st_.dn+"/"+st_.q.length:"não se aplica"}</span></div>`}).join("");
  const esq=`<div class="mapa">${rows}</div>`;if(!lg)return esq;
  const n=by(S.prev),s=stat(n),u=S.h.filter(x=>x[2]===n.id).pop();
  return `<div class="cartao">${esq}</div><div class="cartao pn"><h4>Passo selecionado</h4><div class="pt"><h3>${ab(n.q||lab(n))}</h3></div><div class="pt"><span class="st ${s}">${STN[s]}</span><span class="tag b${n.l}" tabindex="0" data-tip="${tipSetor(n.l)}">${laneNome(n.l)}</span><span class="nota">Fase ${n.f+1}: ${F[n.f][0]}</span></div><p>${u?`<span class="nota num">${u[0]}</span> ${ab(u[1])}`:ab(v(n.e,S.tipo))}</p><span style="flex:1"></span><div class="acoes"><button class="pri" data-n="${n.id}" style="flex:1">Abrir este passo →</button></div></div>`}

/* ---------- Comparar, Documentos, Histórico, legenda ---------- */
function comparar(){const f=S.fase;let r="";
  N.filter(n=>n.f===f).forEach(n=>{const dif=n.tp.length<3||typeof n.t==="object";
    r+=`<tr class="${dif?"dif":""}"><td>${ab(laneNome(n.l).replace("NUAL","NPDOC ou NUAL"))}${dif?`<span class="selo">difere</span>`:""}</td>`+["p","c","s"].map(t=>n.tp.includes(t)?`<td>${ab(n.kind==="gw"?"◇ "+lab(n,t):lab(n,t))}${n.cond?" (se sim)":""}</td>`:`<td class="nao">não tem</td>`).join("")+`</tr>`});
  return trilho()+`<div class="cartao cresce rol"><div class="fh"><h2>Fase ${f+1}: ${F[f][0]}, nos três tipos de compra</h2><span class="nota">Troque de fase no trilho acima.</span></div><table><tr><th>Quem faz essa parte?</th><th>Permanente</th><th>Consumo</th><th>Serviço</th></tr>${r}</table></div>`}
function docsView(){const q=path().filter(n=>n.k==="peca"&&!skip(n));
  return `<div class="cartao cresce rol"><div class="fh"><h2>Minutas e documentos gerados</h2><span class="nota">${q.filter(n=>S.docs[n.id]).length} de ${q.length} geradas</span></div><table><tr><th>Documento e fase</th><th>Arquivo e data</th><th>Nº ${ab("SEI")}</th></tr>`
    +q.map(n=>{const d=S.docs[n.id];return `<tr class="clicavel" data-n="${n.id}" tabindex="0" data-tip="Ir para este passo"><td>${ab(n.doc)}<small>${n.f+1}. ${F[n.f][0]}</small></td><td class="arq">${d?`${arq(n)}<small class="num">${d}</small><button type="button" class="mini" data-dl="${esc(arq(n))}">Baixar uma nova cópia</button>`:`<span class="nota">ainda não gerada</span>`}</td><td class="num">${S.sei[n.id]?esc(S.sei[n.id]):"–"}</td></tr>`}).join("")
    +`<tr><td>Checklist do processo, para anexar<small>todas as fases</small></td><td class="arq">${S.docs._ck?`${esc(S.arqs._ck||"")}<small class="num">${S.docs._ck}</small><button type="button" class="mini" data-dl="${esc(S.arqs._ck||"")}">Baixar uma nova cópia</button>`:`<span class="nota">ainda não gerado</span>`}</td><td class="num">–</td></tr></table>`
    +`<p class="nota">Cada minuta sai no passo em que é usada. O checklist pode ser gerado a qualquer momento.</p><div class="botoes"><button class="pri" data-a="ck">${S.docs._ck?"Gerar o checklist de novo":"Gerar o checklist"}</button>${S.docs._ck?`<button data-a="abrirck">Baixar o checklist (Word)</button>`:""}<button data-a="pasta">Baixar todas as minutas (.zip)</button><button type="button" data-del="${esc(PED.id)}">Apagar este pedido</button><button class="lnk" data-a="cancelar" data-tip="${S.cancelado?"Volta o pedido para a lista dos que estão em andamento e para a conta do teto.":"Para pedido repetido, de teste ou desistido: sai da conta do teto do item. Nada é apagado e dá para reativar."}">${S.cancelado?"Reativar este pedido":"Cancelar este pedido"}</button></div>${S.cancelado?`<p class="aviso">Pedido cancelado: não entra na conta do teto do item.</p>`:""}${S.msg?`<p class="nota" role="status">${esc(S.msg)}</p>`:""}</div>`}
function legenda(){const L=[
   [`<circle class="ev" cx="27" cy="17" r="9"/>`,"Início","Círculo de linha fina. É onde o processo, ou a fase, começa."],
   [`<circle class="ev end" cx="27" cy="17" r="9"/>`,"Fim","Círculo de linha grossa. É onde termina."],
   [`<rect class="shx" x="6" y="5" width="42" height="24" rx="7"/><rect class="s1" x="8" y="9" width="4" height="16" rx="2"/>`,"Tarefa","Um trabalho que alguém faz. O friso colorido à esquerda mostra o setor responsável."],
   [`<rect class="shx" x="6" y="3" width="42" height="28" rx="6"/><rect x="22" y="20" width="10" height="10" class="shx"/><path d="M24.5,25h5M27,22.5v5" class="mk1"/>`,"Fase (subprocesso)","Um conjunto de tarefas. No trilho do alto, cada número é uma fase; clique para abrir."],
   [`<polygon class="shx" points="27,3 41,17 27,31 13,17"/><path class="mk" d="M22,12l10,10M32,12l-10,10"/>`,"Decisão","Uma pergunta. Só um dos caminhos segue, conforme a resposta."],
   [`<circle class="shx" cx="27" cy="17" r="13"/><circle cx="27" cy="17" r="10" class="mk1"/><path class="mk" stroke-width="1.3" d="M27,10v7h5"/>`,"Espera com prazo","O processo fica parado até o prazo acabar."],
   [`<rect class="ln" x="2" y="4" width="50" height="26"/><rect class="lb c1" x="2" y="4" width="14" height="26"/><path d="M16,17h36" class="mk1"/>`,"Raias","Cada faixa é um setor. A tarefa fica na faixa de quem a faz."],
   [`<path class="ed" d="M6,17H46" marker-end="url(#a1)"/>`,"Seta cheia","A ordem das tarefas dentro da região."],
   [`<path class="mf" d="M6,17H46" marker-start="url(#a3)" marker-end="url(#a2)"/>`,"Seta tracejada","Mensagem trocada com quem está fora da região: a empresa ou a Administração Central."],
   [`<path class="dob" d="M19,4h10l6,6v20h-16z"/>`,"Documento","O papel que a tarefa produz e que entra no processo SEI. Preenchido quando a minuta já foi gerada."],
   [`<g class="nd done"><rect class="sh" x="6" y="5" width="42" height="24" rx="7"/></g><circle class="ck" cx="46" cy="7" r="6"/><path class="bw" d="M43,7l2.2,2.4l3.8,-4.6"/>`,"Verde com visto","Passo já feito."],
   [`<g class="nd wait"><rect class="sh" x="6" y="5" width="42" height="24" rx="7"/></g><circle class="wt" cx="46" cy="7" r="6"/><path class="bw" d="M46,3.5V7h2.8"/>`,"Âmbar com relógio","Você já pediu e está aguardando outro setor."],
   [`<g class="nd cur"><rect class="sh" x="6" y="5" width="42" height="24" rx="7"/></g>`,"Destaque com borda grossa","Fazer agora: é o próximo passo deste pedido."],
   [`<rect class="shx" x="6" y="5" width="42" height="24" rx="7" style="stroke-dasharray:4 2.5"/>`,"Borda tracejada","Tarefa de outro setor. Não é de quem abre o processo: aparece só para mostrar o caminho."],
   [`<circle class="shx" cx="27" cy="17" r="10" style="stroke-width:3.4"/>`,"Processo para","Círculo de linha bem grossa no meio do caminho: o processo termina ali, como quando há ata vigente."]];

/* ---------- explicação detalhada do processo ---------- */
const REFS=[["Portaria SES nº 473, de 04/12/2023","https://www.sinj.df.gov.br/sinj/Norma/49fa3b0036844f1994274190e7ad8fdb/ses_prt_473_2023.html","sinj.df.gov.br › Portaria 473/2023","a norma do PDPAS na SES-DF"],
 ["Manual do PDPAS, v2.0 (SES-DF, 03/09/2024)","https://info.saude.df.gov.br/wp-content/uploads/2024/09/2024_09_03-DIORG-GMPROC-Manual_PDPAS_Aquisicoes_e_prestacao_de_contas.pdf","info.saude.df.gov.br › Manual PDPAS (PDF)","o roteiro das atividades e da prestação de contas"]];

    +`<p><b>Material permanente</b> é o único que passa pelo parecer técnico de uma área central da SES (fase 3). O TR é assinado pelos gestores de todas as gerências interessadas. O bem é recebido no NPDOC, atestado com fotos, distribuído às gerências e tombado no SisGepat.</p>`
    +`<p><b>Material de consumo</b> não tem parecer central nem tombamento. O núcleo que guarda o material (NUAL ou NLF) emite o Nada Consta e a declaração de ata, recebe o material, e o setor de origem atesta a Nota Fiscal.</p>`

  return trilho()+`<div class="cartao cresce rol"><div class="fh"><h2>Passo a passo do processo</h2>${tipos}${volta}</div>${refs}`
    +F.map((X,f)=>{const q=p.filter(n=>n.f===f),aus=ausente([...new Set(N.filter(n=>n.f===f).flatMap(n=>[...n.tp]))].join(""));let i=0;
      return `<section class="expf" id="expf${f}"><h3>Fase ${f+1}: ${X[0]}</h3>`+(aus?`<p class="obs">Obs.: etapa ausente para ${aus}.</p>`:"")+(q.length?faseTxt(f)+`<div class="sc">${diagram(q)}</div>`+q.map(n=>{if(n.kind==="task")i++;const gw=n.kind==="gw",so=ausente(n.tp);
        return `<div class="expp" id="xp-${n.id}" style="border-left-color:var(--s${n.l})"><p><b>${gw?"Decisão: ":n.kind==="task"?i+". ":""}${ab(gw?n.q:lab(n))}</b> <span class="tag b${n.l}">${laneCurto(n.l)}</span></p>`+avOutro(n)+avDuv(n)

          +`<dl>${dx("Quem faz essa parte?",laneNome(n.l))}${ehOrigem(n)?dx("O que pedir",v(n.pd,S.tipo)):""}${dx("O que volta",n.vt)}${dx("Prazo",n.pz)}${dx("Como obter ou cobrar",n.ob)}${dx("Ao voltar",n.dv)}${n.doc?`<dt>Documento</dt><dd>${ab(n.doc)}${minuta(n)}</dd>`:""}${dx("Base",n.bn)}</dl>`

/* ---------- janela do processo (/fluxo?bpmn=1, aberta pelo botão "Ver fluxograma completo" da telinha) ---------- */
const PTIPOS=[["c","Consumo"],["p","Permanente"],["s","Serviço"]];
function soBpmn(){

    +`<button type="button" class="zm" data-pz="-" title="Afastar (ou Ctrl + roda do mouse)" aria-label="Afastar">−</button><span class="zv" id="pZv"></span><button type="button" class="zm" data-pz="+" title="Aproximar (ou Ctrl + roda do mouse)" aria-label="Aproximar">+</button>`

    +`<div id="bps"><div class="pg" id="pg"><div id="pCan"></div>${diagram(path())}</div></div><div id="pDetW"></div>`}
function bpFaixas(sv){const vb=sv.viewBox.baseVal,W=vb.width,H=vb.height,ph={};let g="";
  sv.querySelectorAll("g.nd").forEach(el=>{const n=by(el.dataset.n),b=el.getBBox(),o=ph[n.f]||(ph[n.f]=[1e9,0,1e9,0]);
    o[0]=Math.min(o[0],b.x);o[1]=Math.max(o[1],b.x+b.width);o[2]=Math.min(o[2],b.y);o[3]=Math.max(o[3],b.y+b.height)});
  for(const f in ph){const [a,b]=ph[f];g+=`<g class="fx" data-fz="${f}" data-tip="${esc("Fase "+(+f+1)+": "+F[f][0]+". "+F[f][1])}"><rect x="${a-6}" y="-17" width="${b-a+12}" height="14" rx="4"/><text x="${(a+b)/2}" y="-6.5" text-anchor="middle" font-size="9.5">${+f+1}. ${esc(F[f][0])}</text></g>`}
  sv.setAttribute("viewBox",`0 ${-FAIXA} ${W} ${H+FAIXA}`);sv.insertAdjacentHTML("beforeend",g);
  S.bpF=ph;S.bpW=W;S.bpH=H+FAIXA;return H}
function bpFaseDe(cx){let mel=0,dist=1e9;
  for(const f in S.bpF){const [a,b]=S.bpF[f];const d=cx<a?a-cx:cx>b?cx-b:0;if(d<dist){dist=d;mel=+f}}
  return mel}
const tam=(el,w,h)=>{if(!el)return;el.style.setProperty("width",w+"px","important");el.style.setProperty("height",h+"px","important")};
/* um desenho só, mostrado em três recortes: setores (esquerda), fases (alto) e o miolo, para os nomes nunca saírem da vista */
function bpPos(){const g=$("pg"),sv=g&&g.querySelector("svg");if(!sv)return;
  const H=bpFaixas(sv),W=S.bpW,L=PW+LW;
  const top=sv.cloneNode(true),lad=sv.cloneNode(true);
  for(const c of [top,lad]){c.setAttribute("aria-hidden","true");c.querySelectorAll("[tabindex]").forEach(x=>x.removeAttribute("tabindex"));c.querySelectorAll("[role]").forEach(x=>x.removeAttribute("role"))}
  top.querySelectorAll("g.nd").forEach(x=>x.remove());
  /* nomes curtos das caixas de fora da região, para caber na coluna dos setores; no miolo o nome cortado some */
  lad.querySelectorAll("rect.poolx").forEach(r=>{const t=r.nextElementSibling;if(t&&t.tagName==="text"){t.textContent=/Central/.test(t.textContent)?"SES central":"Empresa";t.setAttribute("font-size","9.5")}});
  sv.querySelectorAll("rect.poolx").forEach(r=>{const t=r.nextElementSibling;if(t&&t.tagName==="text")t.style.display="none"});
  top.id="pTop";lad.id="pLad";sv.id="pMain";
  top.setAttribute("viewBox",`${L} ${-FAIXA} ${W-L} ${FAIXA}`);lad.setAttribute("viewBox",`0 0 ${L} ${H}`);sv.setAttribute("viewBox",`${L} 0 ${W-L} ${H}`);
  for(const c of [top,lad,sv])c.setAttribute("preserveAspectRatio","xMinYMin meet");
  g.insertBefore(top,sv);g.insertBefore(lad,sv);
  if(!S.z||S.zAuto)S.z=bpAjuste();
  S.pFase=undefined;bpZoom(S.z,false);
  const c=$("bps");if(S.pScroll){c.scrollLeft=S.pScroll[0];c.scrollTop=S.pScroll[1]}S.pScroll=undefined;
  if(S.pSel)bpDet(S.pSel);bpMarca()}
/* o processo é sempre mais largo que a janela: desconta a barra de rolagem de baixo mesmo antes de ela aparecer */
function bpAjuste(){const c=$("bps");if(!c||!S.bpH)return 1;const sb=c.offsetHeight-c.clientHeight-2,h=c.clientHeight-(sb>8?0:17)-2;

function bpZoom(z,manter){const c=$("bps"),g=$("pg");if(!c||!g||!S.bpW)return;const L=PW+LW,W=S.bpW,H=S.bpH-FAIXA,o=S.z||z;
  const mx=(c.scrollLeft+(c.clientWidth-L*o)/2)/o,my=(c.scrollTop+(c.clientHeight-FAIXA*o)/2)/o;

  g.style.gridTemplateColumns=`${L*z}px ${(W-L)*z}px`;g.style.gridTemplateRows=`${FAIXA*z}px ${H*z}px`;

/* a fase que está à vista fica marcada na faixa do alto */

  if(f===S.pFase)return;S.pFase=f;const t=$("pTop");if(t)t.querySelectorAll(".fx").forEach(el=>el.classList.toggle("at",+el.dataset.fz===f))}
function bpIrFase(f){const c=$("bps"),o=S.bpF&&S.bpF[f];if(!c||!o)return;c.scrollTo({left:Math.max(0,(o[0]-(PW+LW)-14)*S.z),behavior:"smooth"})}
function bpDet(id){const w=$("pDetW"),m=$("pMain");if(!w)return;S.pSel=id||null;

/* apagar pedidos: caixas de seleção na lista; no computador a pasta vai para Processos\_apagados (recuperável) */

async function gerar(chave,rotulo,id){try{const r=await api("/api/gerar_peca",{id:PED.id,peca:chave});PED.arquivos=r.arquivos;montarDocs();log("Minuta gerada: "+r.arquivo+".",id);S.msg="Gerada: "+r.arquivo}catch(e){S.msg="Não gerei "+rotulo+": "+e.message}render()}

function act(a){S.msg="";const n=S.sel.k==="n"?by(S.sel.id):null,sei=(($("sei")||{}).value||"").trim();

  else if(!n)return;
  else if(a==="minuta")return gerar(PK[n.id],"a minuta",n.id);
  else if(a==="abrir")return abrirArq(nomeArq(n));
  else if(a==="pedi"){S.d[n.id]="w";if(sei)S.sei[n.id]=sei;log("Pedido registrado. Aguardando "+laneNome(n.l)+".",n.id)}
  else if(a==="reabrir"){delete S.d[n.id];log("Passo reaberto.",n.id)}
  else if(a==="feito"||a==="sim"||a==="nao"){S.d[n.id]="d";
    if(a==="feito"){if(sei)S.sei[n.id]=sei;log((n.kind==="timer"?"Prazo encerrado.":n.kind==="stop"?"Pedido encerrado: há ata vigente.":n.k==="peca"?"Marcado como feito.":"Devolutiva registrada.")+(sei?" SEI "+sei+".":""),n.id)}
    else{S.ans[n.id]=a==="sim"?"s":"n";log("Decisão “"+n.t+"”: "+(a==="sim"?"sim":"não")+".",n.id)}
    const c=cur();if(c){S.fase=c.f;S.sel={k:"n",id:c.id};S.sub=""}}
  render()}
function janela(ampla){try{const sw=screen.availWidth,sh=screen.availHeight,x0=screen.availLeft||0,y0=screen.availTop||0,w=ampla?Math.min(sw,1300):Math.floor(sw/2);
  window.resizeTo(w,sh);window.moveTo(x0+sw-w,y0)}catch(e){}}
const tip=$("tip");
function showTip(el){tip.textContent=el.dataset.tip;tip.hidden=false;const r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;
  let x=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8)),y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;tip.style.left=x+"px";tip.style.top=Math.max(8,y)+"px"}
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el);else tip.hidden=true});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&e.target.matches(":focus-visible"))showTip(el)});
["focusout","scroll"].forEach(ev=>document.addEventListener(ev,()=>{tip.hidden=true},true));
/* mãozinha: clicar e arrastar move o desenho; a roda anda para os lados; Ctrl + roda aproxima ou afasta */
let arr=null;
document.addEventListener("pointerdown",e=>{if(S.view!=="bpmn"||e.button)return;const c=$("bps");if(!c||!c.contains(e.target))return;
  arr={x:e.clientX,y:e.clientY,l:c.scrollLeft,t:c.scrollTop,m:false}});
function solta(){if(!arr)return;const m=arr.m,c=$("bps");arr=null;if(c)c.classList.remove("arr");if(m){S.arrastou=true;setTimeout(()=>{S.arrastou=false},80)}}
document.addEventListener("pointermove",e=>{if(!arr)return;if(!e.buttons)return solta();const c=$("bps"),dx=e.clientX-arr.x,dy=e.clientY-arr.y;
  if(!arr.m&&Math.abs(dx)+Math.abs(dy)<5)return;arr.m=true;tip.hidden=true;c.classList.add("arr");c.scrollLeft=arr.l-dx;c.scrollTop=arr.t-dy;e.preventDefault()});
["pointerup","pointercancel"].forEach(ev=>document.addEventListener(ev,solta));
document.addEventListener("wheel",e=>{if(S.view!=="bpmn")return;const c=$("bps");if(!c||!c.contains(e.target))return;
  if(e.ctrlKey){e.preventDefault();S.zAuto=false;bpZoom(S.z*(e.deltaY<0?1.12:1/1.12),true);return}
  if(!e.shiftKey&&c.scrollHeight<=c.clientHeight+1&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();c.scrollLeft+=e.deltaY}},{passive:false});
document.addEventListener("scroll",e=>{if(e.target&&e.target.id==="bps")bpMarca()},true);
document.addEventListener("click",async e=>{tip.hidden=true;const t=e.target;let el;
  if(S.view==="bpmn"){if(S.arrastou)return;
    if(el=t.closest("[data-ptp]")){if(S.tipo!==el.dataset.ptp){S.tipo=el.dataset.ptp;S.pSel=null;S.pScroll=null;render()}return}
    if(el=t.closest("[data-pz]")){const k=el.dataset.pz;if(k==="fit"){S.zAuto=true;bpZoom(bpAjuste(),true)}else{S.zAuto=false;bpZoom(S.z*(k==="+"?1.2:1/1.2),true)}return}
    if(el=t.closest("[data-pd]")){if(el.dataset.pd==="x")bpDet(null);else{const n=by(S.pSel);location.href=location.pathname+"?exp=1&f="+n.f+"&n="+encodeURIComponent(n.id)+"&t="+S.tipo}return}
    if(el=t.closest("[data-fz]")){bpIrFase(+el.dataset.fz);return}
    if(el=t.closest("#pMain [data-n]")){bpDet(el.dataset.n===S.pSel?null:el.dataset.n);return}
    return}
  if(el=t.closest("[data-gm]")){const n=by(el.dataset.gn);if(el.dataset.gm==="abrir")abrirArq(nomeArq(n));else{S.alvo=n.id;gerar(PK[n.id],"a minuta",n.id)}return}
  if(t.closest(".selc"))return;     /* a caixa de seleção não abre o pedido */
  if(el=t.closest("#bApagar")){apagarSel(el);return}
  if(el=t.closest("[data-p]"))abrirPedido(el.dataset.p);
  else if(el=t.closest("[data-tp]")){if(!PED){S.tipo=el.dataset.tp;render()}}
  else if(el=t.closest("[data-pv]")){S.prev=el.dataset.pv;render()}
  else if(el=t.closest("[data-n]")){const id=el.dataset.n;if(S.view==="exp"&&!S.leg){const x=$("xp-"+id);if(x)x.scrollIntoView({block:"center"});return}const era=S.view==="pedido"&&!S.leg&&!larga()&&S.sel.k==="n"&&S.sel.id===id&&el.classList.contains("cab");
    S.msg="";S.view="pedido";S.leg=false;S.fase=by(id).f;S.sub="";S.sel=era?{k:"x"}:{k:"n",id};render()}
  else if(el=t.closest("[data-ir]")){S.view="pedido";selFase(+el.dataset.ir);render()}
  else if(el=t.closest("[data-f]")){selFase(+el.dataset.f);render()}
  else if(el=t.closest("[data-sb]")){S.sub=S.sub===el.dataset.sb?"":el.dataset.sb;render()}
  else if(el=t.closest("[data-v]")){if(el.disabled)return;S.view=el.dataset.v;S.leg=false;S.msg="";if(S.view==="pedidos")await carregarLista();render()}
  else if(el=t.closest("[data-a]"))act(el.dataset.a);
  else if(t.id==="bLeg")act("leg");
  else if(t.id==="bWide"){S.wide=!S.wide;janela(S.wide);render()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.view==="bpmn"&&S.pSel){e.preventDefault();bpDet(null);return}if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("g[tabindex],tr[tabindex]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}});
setInterval(()=>S.view==="bpmn"||fetch("/api/ping").then(()=>{if(QUEDA){QUEDA=false;render()}}).catch(()=>{if(!SITE&&!QUEDA){QUEDA=true;render()}}),INTERVALO_PING_MS);
(async function(){const q=new URLSearchParams(location.search),p=q.get("p");
  if(q.get("bpmn")){S.view="bpmn";S.zAuto=true;window.name="pdpasProcesso";document.title="Fluxograma completo do PDPAS";const t=q.get("t"),tc=tipoCurto(t)||(Object.hasOwn(TIPO,t)?t:null);if(tc)S.tipo=tc;
    document.documentElement.classList.add("sobpmn");document.body.classList.add("sobpmn");render();return}
  if(q.get("exp")){S.view="exp";S.fase=Math.min(8,Math.max(0,+q.get("f")||0));S.alvo=q.get("n")||"";if(Object.hasOwn(TIPO,q.get("t")))S.tipo=q.get("t");render()}
  if(location.search)history.replaceState(null,"",location.pathname);
  await carregarLista();
  if(p)await abrirPedido(p);else if(S.view!=="exp")render()})();
document.addEventListener("click",e=>{const b=e.target.closest("[data-dl]");if(b){e.stopPropagation();e.preventDefault();abrirArq(b.dataset.dl)}},true);
document.addEventListener("click",async e=>{const b=e.target.closest("[data-del]");if(!b)return;e.stopPropagation();e.preventDefault();if(b.dataset.conf!=="1"){b.dataset.conf="1";b.textContent="Confirmar: apagar de vez";return}try{await api("/api/apagar_pedido",{id:b.dataset.del});if(PED&&PED.id===b.dataset.del){PED=null;S.view="pedidos"}S.msg="Pedido apagado deste aparelho.";await carregarLista();render()}catch(x){S.msg=x.message;render()}},true);
</script>
</body>
</html>
